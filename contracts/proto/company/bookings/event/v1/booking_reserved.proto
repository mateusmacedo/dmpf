syntax = "proto3";

package company.bookings.event.v1;

import "google/protobuf/timestamp.proto";

// A booking was reserved in the resource-scheduling bounded context.
// Envelope type: com.company.bookings.booking-reserved.v1 (PTB-03).
message BookingReserved {
  string booking_id = 1;
  string resource_id = 2;
  int32 quantity = 3;
  google.protobuf.Timestamp reserved_at = 4;
}
