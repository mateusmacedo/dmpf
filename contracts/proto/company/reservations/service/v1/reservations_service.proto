syntax = "proto3";

package company.reservations.service.v1;

// Internal synchronous surface of the reservations bounded context (GRP-01). A
// domain refusal travels as `rejection` in the response; a technical failure is
// a gRPC status.
service ReservationsService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc FindReservation(FindReservationRequest) returns (FindReservationResponse);
}

message ReserveRequest {
  string order_id = 1;
  int32 item_count = 2;
}

message ReserveResponse {
  oneof result {
    Reserved reserved = 1;
    Rejection rejection = 2;
  }
}

message Reserved {
  string order_id = 1;
  int32 item_count = 2;
}

message CancelRequest {
  string order_id = 1;
}

message CancelResponse {
  oneof result {
    Canceled canceled = 1;
    Rejection rejection = 2;
  }
}

message Canceled {
  string order_id = 1;
}

message FindReservationRequest {
  string order_id = 1;
}

message FindReservationResponse {
  Reservation reservation = 1;
}

message Reservation {
  string order_id = 1;
  ReservationStatus status = 2;
  int32 item_count = 3;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_CONFIRMED = 1;
  RESERVATION_STATUS_CANCELED = 2;
}

message Rejection {
  string code = 1;
  string message = 2;
}
