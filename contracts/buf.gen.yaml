version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mateusmacedo/dmpf/libs/backend/go/contracts/gen/go
plugins:
  # Pin do plugin (BUF-06): a versão precisa ser igual à de google.golang.org/protobuf
  # no go.mod de libs/backend/go/contracts; tools/buf-gate.sh pins confere.
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: ../libs/backend/go/contracts/gen/go
    opt: paths=source_relative
inputs:
  - directory: proto
