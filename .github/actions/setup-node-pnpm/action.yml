name: Setup Node and pnpm
description: Setup pnpm, Node.js cache, and install dependencies
inputs:
  node-version:
    description: Node.js version used in CI
    required: false
    default: "24"
runs:
  using: composite
  steps:
    # Sem `version`: o pnpm/action-setup infere a versão do campo `packageManager`
    # do package.json (fonte única). Passar ambos causa ERR_PNPM_BAD_PM_VERSION.
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
