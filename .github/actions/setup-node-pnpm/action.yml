name: Setup Node and pnpm
description: Setup pnpm, Node.js cache, and install dependencies
inputs:
  node-version:
    description: Node.js version used in CI
    required: false
    default: "24"
runs:
  using: composite
  steps:
    # Sem `version`: o pnpm/action-setup infere a versão do campo `packageManager`
    # do package.json (fonte única). Passar ambos causa ERR_PNPM_BAD_PM_VERSION.
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
