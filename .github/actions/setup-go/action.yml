name: Setup Go
description: Setup Go from the workspace BOM and check the prerequisites of the race detector
inputs:
  go-version:
    description: Go version; empty reads the go directive of go.work
    required: false
    default: ""
  versions-file:
    description: versions.json of the dmpf-plugin, which carries the pins of the Go tools
    required: false
    default: tools/dmpf-plugin/versions.json
  go-sum-paths:
    description: Globs of the go.sum files in the cache key, rooted so the hash skips node_modules
    required: false
    default: |
      apps/**/go.sum
      libs/**/go.sum
      tools/**/go.sum
outputs:
  golangci-lint-key:
    description: Prefix of the golangci-lint cache key; whoever saves the cache appends a unique suffix
    value: ${{ steps.keys.outputs.golangci }}
runs:
  using: composite
  steps:
    # Sem `go-version` por padrão: o `go-version-file` lê a diretiva do go.work,
    # que é a fonte única do piso (BOM). Passar a versão aqui abriria uma
    # segunda fonte, que sairia do lugar no primeiro bump.
    - name: Setup Go
      id: setup_go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: go.work
        cache: false

    # O cache do setup-go não aceita restore-keys: um go.sum alterado perdia o cache
    # inteiro. A chave hasheia o conteúdo, não o caminho, que no consumidor passa por `.dmpf-ci/`.
    - name: Chaves de cache
      id: keys
      shell: bash
      env:
        GO_SUM_PATHS: ${{ inputs.go-sum-paths }}
        VERSIONS_FILE: ${{ inputs.versions-file }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        arquivos=(go.work)
        [ -f go.work.sum ] && arquivos+=(go.work.sum)
        while IFS= read -r padrao; do
          [ -n "$padrao" ] || continue
          for arquivo in $padrao; do
            arquivos+=("$arquivo")
          done
        done <<<"$GO_SUM_PATHS"
        arquivos+=("$VERSIONS_FILE" "$GITHUB_ACTION_PATH/action.yml")
        golangci="$(jq -r .golangciLint "$VERSIONS_FILE")"
        configuracao=none
        [ -f .golangci.yml ] && configuracao="$(sha256sum .golangci.yml | cut -c1-16)"
        {
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "gocache=$(go env GOCACHE)"
          echo "go=$(sha256sum "${arquivos[@]}" | cut -d' ' -f1 | sha256sum | cut -c1-64)"
          echo "golangci=golangci-lint-$RUNNER_OS-$golangci-$configuracao"
        } >> "$GITHUB_OUTPUT"

    # Cache de GOMODCACHE e GOCACHE chaveado pelos arquivos que carregam os pins:
    # sem ele cada job recompila golangci-lint, govulncheck, buf e protoc-gen-go por `go run` (~10 min).
    - name: Cache de módulos e build do Go
      id: go_cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ${{ steps.keys.outputs.gomodcache }}
          ${{ steps.keys.outputs.gocache }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_go.outputs.go-version }}-${{ steps.keys.outputs.go }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_go.outputs.go-version }}-

    # Só restaura: quem grava é o cache-seed.yml, com sufixo único por execução, para
    # que a chave estável não congele o cache na primeira gravação.
    - name: Cache do golangci-lint
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/golangci-lint
        key: ${{ steps.keys.outputs.golangci }}
        restore-keys: |
          ${{ steps.keys.outputs.golangci }}-

    # O post-step do cache só salva em miss e salva o que houver: um PR sem
    # projeto Go afetado semearia um GOCACHE vazio que os hits seguintes nunca substituem.
    # Por isso, em miss, cada ferramenta pinada é compilada aqui (pins do versions.json).
    - name: Warm Go tools on cache miss
      if: steps.go_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSIONS_FILE: ${{ inputs.versions-file }}
      run: |
        set -euo pipefail
        pins=(
          "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(jq -r .golangciLint "$VERSIONS_FILE")"
          "golang.org/x/vuln/cmd/govulncheck@$(jq -r .govulncheck "$VERSIONS_FILE")"
          "github.com/bufbuild/buf/cmd/buf@$(jq -r .buf "$VERSIONS_FILE")"
          "google.golang.org/protobuf/cmd/protoc-gen-go@$(jq -r .protocGenGo "$VERSIONS_FILE")"
        )
        for pkg in "${pins[@]}"; do
          case "$pkg" in *@v[0-9]*) ;; *) echo "pin nao encontrado: $pkg" >&2; exit 1 ;; esac
        done
        pids=()
        for i in "${!pins[@]}"; do
          go run "${pins[$i]}" --version > "$RUNNER_TEMP/warm-go-tool-$i.log" 2>&1 &
          pids+=("$!")
        done
        falhou=0
        for i in "${!pins[@]}"; do
          resultado=ok
          wait "${pids[$i]}" || { resultado=FALHA; falhou=1; }
          echo "::group::go run ${pins[$i]} --version ($resultado)"
          cat "$RUNNER_TEMP/warm-go-tool-$i.log"
          echo "::endgroup::"
        done
        exit "$falhou"

    # `go test -race` exige CGO e um compilador C, que o setup-go não instala.
    # Sem este preflight a falha aparece adiante, como erro obscuro de link.
    - name: Check race detector prerequisites
      shell: bash
      run: |
        set -euo pipefail
        go version
        if [ "$(go env CGO_ENABLED)" != "1" ]; then
          echo "CGO_ENABLED=$(go env CGO_ENABLED); go test -race exige CGO_ENABLED=1" >&2
          exit 1
        fi
        if ! command -v cc >/dev/null 2>&1; then
          echo "compilador C ausente (cc); go test -race nao roda sem ele" >&2
          exit 1
        fi
        echo "pre-requisitos do -race: CGO_ENABLED=1 e cc presentes"
