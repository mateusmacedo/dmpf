name: Setup Go
description: Setup Go from the workspace BOM and check the prerequisites of the race detector
runs:
  using: composite
  steps:
    # Sem `go-version` literal: o `go-version-file` lê a diretiva do go.work,
    # que é a fonte única do piso (BOM). Passar a versão aqui abriria uma
    # segunda fonte, que sairia do lugar no primeiro bump.
    # Cache de GOMODCACHE e GOCACHE chaveado pelos arquivos que carregam os pins:
    # sem ele cada job recompila golangci-lint, govulncheck, buf e protoc-gen-go por `go run` (~10 min).
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.work
        cache: true
        cache-dependency-path: |
          go.work
          **/go.sum
          nx.json
          tools/buf.sh
          contracts/buf.gen.yaml

    # O module path fica em host privado. Localmente isso funciona porque o
    # `go env` do desenvolvedor traz GOPRIVATE; o runner não tem nada disso, e
    # sem a variável o Go consultaria proxy.golang.org e sum.golang.org com um
    # caminho interno — vazando o nome do repositório e falhando a resolução.
    # GOPRIVATE já implica GONOPROXY e GONOSUMDB, então basta ela.
    - name: Configure private module path
      shell: bash
      run: echo "GOPRIVATE=gitea.lidercap.com.br" >> "$GITHUB_ENV"

    # `go test -race` exige CGO e um compilador C, que o setup-go não instala.
    # Sem este preflight a falha aparece adiante, como erro obscuro de link.
    - name: Check race detector prerequisites
      shell: bash
      run: |
        set -euo pipefail
        go version
        if [ "$(go env CGO_ENABLED)" != "1" ]; then
          echo "CGO_ENABLED=$(go env CGO_ENABLED); go test -race exige CGO_ENABLED=1" >&2
          exit 1
        fi
        if ! command -v cc >/dev/null 2>&1; then
          echo "compilador C ausente (cc); go test -race nao roda sem ele" >&2
          exit 1
        fi
        echo "GOPRIVATE=$(go env GOPRIVATE)"
        echo "pre-requisitos do -race: CGO_ENABLED=1 e cc presentes"
