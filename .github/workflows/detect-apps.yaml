name: Detect Apps

# Detecta as apps deployáveis afetadas desde o último run verde deste workflow
# na branch, pelo grafo do Nx (ADR-071). Internalizado a partir do template de
# actions externo: o repositório que o hospedava saiu do alcance deste projeto, e
# um reusable que não se pode versionar nem auditar quebra sem aviso.
on:
  workflow_call:
    inputs:
      marker_file:
        description: "Arquivo que identifica uma app deployável (ex: 'Dockerfile')"
        required: false
        type: string
        default: "Dockerfile"
      runner:
        description: "Runner para execução"
        required: false
        type: string
        default: "ubuntu-26.04"
    outputs:
      apps:
        description: "JSON array com o root das apps detectadas (ex: [\"apps/backend/bff\"])"
        value: ${{ jobs.detect.outputs.apps }}

permissions:
  actions: read
  contents: read

jobs:
  detect:
    runs-on: ${{ inputs.runner }}
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: ${{ github.ref_name }}
          last-successful-event: ${{ github.event_name }}

      - id: set
        shell: bash
        env:
          MARKER_FILE: ${{ inputs.marker_file }}
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r projeto; do
            raiz="$(pnpm --silent nx show project "$projeto" --json | jq -r .root)"
            [ -f "$raiz/$MARKER_FILE" ] && apps+=("$raiz")
          done < <(pnpm --silent nx show projects --affected --type app --json | jq -r '.[]')
          if [ ${#apps[@]} -eq 0 ]; then
            echo "apps=[]" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$(printf '%s\n' "${apps[@]}" | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          fi
