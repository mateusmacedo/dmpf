name: DMPF Evidence

# Reprova a evidência publicada de uma release que não se reproduz no commit
# registrado no próprio header (BOM-03). Separado do ci.yml porque não depende
# do PR: roda sob demanda ou como gate do dmpf-release.yml, sobre bom/evidence.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release cuja evidência publicada em bom/evidence/<release> é reproduzida"
        required: true
        type: string
  workflow_call:
    inputs:
      release:
        description: "Release cuja evidência publicada em bom/evidence/<release> é reproduzida"
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduzir a evidência publicada
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RELEASE: ${{ inputs.release }}
      DMPF_PG_DSN: "postgres://dmpf:dmpf@localhost:5432/dmpf?sslmode=disable"
      DMPF_KAFKA_BROKERS: "localhost:9092"
      DMPF_REDPANDA_ADMIN: "http://localhost:9644"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Resolver o commit e os subjects da evidência publicada
        id: published
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release inválida: $RELEASE (esperado X.Y.Z)" >&2
            exit 1
          fi
          dir="bom/evidence/$RELEASE"
          test -f "$dir/index.json" || { echo "sem evidência publicada em $dir" >&2; exit 1; }
          commits="$(for f in "$dir"/*.json; do [ "$(basename "$f")" = index.json ] || jq -r '.header.commit' "$f"; done | sort -u)"
          if [ "$(printf '%s\n' "$commits" | wc -l)" -ne 1 ]; then
            echo "subjects registram commits distintos:" >&2
            printf '%s\n' "$commits" >&2
            exit 1
          fi
          case "$commits" in
            *-dirty) echo "evidência gerada sobre árvore com mudanças: $commits" >&2; exit 1 ;;
          esac
          subjects="$(for f in "$dir"/*.json; do n="$(basename "$f" .json)"; [ "$n" = index ] || echo "$n"; done | paste -sd, -)"
          echo "commit=$commits" >> "$GITHUB_OUTPUT"
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"

      - name: Subir Postgres
        run: |
          set -euo pipefail
          nome="dmpf-evidence-postgres-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network "container:$(hostname)" \
            -e POSTGRES_USER=dmpf -e POSTGRES_PASSWORD=dmpf -e POSTGRES_DB=dmpf \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          for _ in $(seq 1 30); do
            if docker exec "$nome" pg_isready -U dmpf -q; then
              echo "postgres pronto em localhost:5432 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres não respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      - name: Subir Redpanda
        run: |
          set -euo pipefail
          nome="dmpf-evidence-redpanda-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network "container:$(hostname)" \
            redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96 \
            redpanda start --mode dev-container --smp 1
          for _ in $(seq 1 30); do
            if docker exec "$nome" rpk cluster info >/dev/null 2>&1; then
              echo "redpanda pronto em localhost:9092 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "redpanda não respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      - name: Regenerar no commit registrado
        env:
          COMMIT: ${{ steps.published.outputs.commit }}
          SUBJECTS: ${{ steps.published.outputs.subjects }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/evidence-worktree"
          git worktree add --detach "$work" "$COMMIT"
          cd "$work"
          GOTOOLCHAIN=go1.26.6 go run ./libs/backend/go/testkit/cmd/evidence \
            --root . --release "$RELEASE" --subjects "$SUBJECTS" \
            --out "$RUNNER_TEMP/evidence-regenerated/$RELEASE"

      - name: Comparar com a evidência publicada
        run: diff -r "bom/evidence/$RELEASE" "$RUNNER_TEMP/evidence-regenerated/$RELEASE"

      - name: Derrubar a infraestrutura do job
        if: always()
        run: docker rm -f "dmpf-evidence-postgres-$(hostname)" "dmpf-evidence-redpanda-$(hostname)" >/dev/null 2>&1 || true
