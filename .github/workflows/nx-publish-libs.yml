name: NX Publish

# Publica as libs no GitHub Packages via `nx release publish`, pelo reusable
# interno em .github/workflows/publish-libs.yaml. O executor pula libs sem
# versão nova e versões já no registry, então releases parciais publicam só o
# que mudou.
# Dispara no push das tags npm do Nx Release (nx-release.yml). A exclusão de
# `dmpf@*` é o que separa as duas famílias de tag: a do produto tem rito próprio
# (dmpf-release.yml) e não publica pacote nenhum. Em filtro de tag do GitHub
# Actions vence o ÚLTIMO padrão que casa, então a negação vem depois. As tags de
# módulo Go (`libs/backend/go/<lib>/vX.Y.Z` e `tools/dmpf-conformance/vX.Y.Z`)
# não casam `**@*` e por construção nunca chegam aqui: consumo Go é por tag no
# git, sem registry.
on:
  push:
    tags:
      - "**@*"
      - "!dmpf@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Dist-tag de publicação (latest, beta, next)"
        type: string
        default: latest

# cancel-in-progress consolida o push de múltiplas tags (versionamento
# independente) em um único run, que publica todas as libs pendentes do commit
# já versionado — o nx release publish ignora as que já estão no registry.
concurrency:
  group: publish-libs
  cancel-in-progress: true

# Least-privilege explícito, em vez de herdar o token default do repositório.
# `contents: read` cobre o checkout; `packages: write` cobre a publicação no
# GitHub Packages, que autentica pelo GITHUB_TOKEN do próprio run — não há mais
# troca OIDC, porque o registry deixou de ser externo.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish-libs.yaml
    with:
      # pnpm_version vazio de propósito: o pnpm/action-setup trata string vazia
      # como ausência e resolve pelo campo packageManager do package.json
      # (pnpm@11.14.0). Passar um valor concreto faz a action abortar com
      # ERR_PNPM_BAD_PM_VERSION, porque ela compara com o packageManager por
      # igualdade de string. Declarado explicitamente, e não omitido, para não
      # depender do default do template — ver ARQ-465.
      pnpm_version: ""
      node_version: "24"
      nx_exclude: "@mateusmacedo/dmpf-source"
      scope: "@mateusmacedo"
      tag: ${{ inputs.tag || 'latest' }}
      build_projects_filter: "tag:type:lib,!tag:stack:go"
