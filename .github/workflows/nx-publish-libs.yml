name: NX Publish

# Republica as libs no GitHub Packages via `nx release publish`, pelo reusable
# interno em .github/workflows/publish-libs.yaml, quando a publicação encadeada
# ao nx-release.yml falhar. O executor pula versões já no registry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dist-tag de publicação (latest, beta, next)"
        type: string
        default: latest
      ref:
        description: "Commit de versão a publicar (o da tag); vazio usa a ponta da branch"
        type: string
        default: ""

concurrency:
  group: publish-libs
  cancel-in-progress: true

# Least-privilege explícito, em vez de herdar o token default do repositório.
# `contents: read` cobre o checkout; `packages: write` cobre a publicação no
# GitHub Packages, que autentica pelo GITHUB_TOKEN do próprio run — não há mais
# troca OIDC, porque o registry deixou de ser externo.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish-libs.yaml
    with:
      # pnpm_version vazio de propósito: o pnpm/action-setup trata string vazia
      # como ausência e resolve pelo campo packageManager do package.json
      # (pnpm@11.14.0). Passar um valor concreto faz a action abortar com
      # ERR_PNPM_BAD_PM_VERSION, porque ela compara com o packageManager por
      # igualdade de string. Declarado explicitamente, e não omitido, para não
      # depender do default do template — ver ARQ-465.
      pnpm_version: ""
      node_version: "24"
      nx_exclude: "@mateusmacedo/dmpf-source"
      scope: "@mateusmacedo"
      tag: ${{ inputs.tag || 'latest' }}
      build_projects_filter: "tag:type:lib,!tag:stack:go"
      ref: ${{ inputs.ref }}
