name: DMPF Go CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Versão do Node.js
        type: string
        default: "24"
      go-version:
        description: Versão Go; vazio lê a diretiva do go.work
        type: string
        default: ""
      plugin-version:
        description: Versão do @mateusmacedo/dmpf-plugin para a qual o chamador foi escrito; vazio dispensa a conferência
        type: string
        default: ""
      base:
        description: Branch base do affected; vazio usa a branch default do repositório
        type: string
        default: ""
      keycloak:
        description: Sobe o Keycloak de referência (infra/keycloak) para os testes de integração do authn; só o repositório do DMPF o liga
        type: boolean
        default: false
      govulncheck:
        description: Roda o govulncheck nos projetos do escopo (etapa de release)
        type: boolean
        default: false
      self-tests:
        description: Roda os vetores negativos dos gates (provam o verificador, não o código)
        type: boolean
        default: false
      platform:
        description: Roda os checks que só existem no repositório do DMPF (generator, init, versions.json, Grafana, OTel)
        type: boolean
        default: false
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        description: Token de CI do Nx Cloud; ausente, vale o acesso que o nxCloudId do nx.json concede
        required: false

permissions: {}

# O env do chamador não chega ao reutilizável; sem CI, tb.Env pula em vez de
# reprovar quando falta uma variável de integração.
env:
  CI: "true"
  # O registry npm do GitHub Packages exige token até para pacote público; o
  # .npmrc de usuário que o job grava o lê daqui para instalar o plugin.
  NODE_AUTH_TOKEN: ${{ github.token }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  dmpf:
    name: DMPF
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      PG_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      KAFKA_BROKERS: "localhost:9092"
      KAFKA_SASL_BROKERS: "localhost:19092"
      KAFKA_SASL_USERNAME: "ci"
      KAFKA_SASL_PASSWORD: "ci-secret"
      SQS_ENDPOINT: "http://localhost:4566"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      REDIS_URL: "redis://revocation:ci-revocation@localhost:6379/0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Origem do workflow reutilizável
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "job.workflow_sha vazio: as actions viriam da branch default do DMPF" >&2
            exit 1
          fi

      # Chamado de outro repositório, o reutilizável resolve `uses: ./...` na
      # árvore do chamador; as actions do DMPF vêm do commit deste workflow.
      - name: Checkout das actions do DMPF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dmpf-ci
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # O pnpm 11.5.3+ não expande ${VAR} em credencial do .npmrc do repositório (GHSA-3qhv-2rgh-x77r).
      - name: Credencial do GitHub Packages no .npmrc de usuário
        run: |
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Setup Node and pnpm
        uses: ./.dmpf-ci/.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}

      - name: Layout DMPF
        uses: ./.dmpf-ci/.github/actions/dmpf-layout
        with:
          plugin-version: ${{ inputs.plugin-version }}

      - name: Setup Go
        uses: ./.dmpf-ci/.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          versions-file: ${{ env.DMPF_PLUGIN_DIR }}/versions.json
          go-sum-paths: |
            ${{ env.DMPF_APPS_DIR }}/**/go.sum
            libs/**/go.sum
            tools/**/go.sum

      # O buf-breaking lê NX_BASE como baseline. Sem main-branch-name a action
      # procura `main`; o fallback é a ponta anterior.
      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: ${{ inputs.base || github.event.repository.default_branch }}
          fallback-sha: ${{ github.event.before }}

      - name: Escopo do diff
        id: scope
        uses: ./.dmpf-ci/.github/actions/dmpf-scope
        with:
          keycloak: ${{ inputs.keycloak }}

      - name: Espelho do Docker Hub
        if: steps.scope.outputs.infra == 'true'
        uses: ./.dmpf-ci/.github/actions/docker-hub-mirror

      - name: Imagens da infra de testes
        if: steps.scope.outputs.infra == 'true'
        run: |
          set -euo pipefail
          compose=(docker compose -f infra/test/compose.yml)
          perfis=()
          while read -r perfil; do perfis+=(--profile "$perfil"); done < <("${compose[@]}" config --profiles)
          servicos="$("${compose[@]}" "${perfis[@]}" config --format json)"
          for par in POSTGRES:postgres REDPANDA:redpanda FLOCI:floci KEYCLOAK:keycloak REDIS:redis; do
            imagem="$(jq -r --arg s "${par#*:}" '.services[$s].image // empty' <<<"$servicos")"
            [[ $imagem =~ ^[a-z0-9][a-z0-9./_:-]*@sha256:[0-9a-f]{64}$ ]] ||
              { echo "infra/test/compose.yml sem imagem fixada por digest para ${par#*:}: '$imagem'" >&2; exit 1; }
            echo "IMAGEM_${par%%:*}=$imagem" >> "$GITHUB_ENV"
          done

      # Sobe antes do lint e do build para que o boot dos serviços (o Keycloak leva
      # ~60 s) corra junto deles; a prontidão só é esperada antes do test-race.
      - name: Subir a infra de testes
        if: steps.scope.outputs.infra == 'true'
        env:
          KEYCLOAK: ${{ steps.scope.outputs.keycloak }}
          REDIS: ${{ steps.scope.outputs.redis }}
        run: |
          set -euo pipefail
          imagens=("$IMAGEM_POSTGRES" "$IMAGEM_REDPANDA" "$IMAGEM_FLOCI")
          [ "$KEYCLOAK" = true ] && imagens+=("$IMAGEM_KEYCLOAK")
          [ "$REDIS" = true ] && imagens+=("$IMAGEM_REDIS")
          pids=()
          for imagem in "${imagens[@]}"; do
            docker pull -q "$imagem" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          # No runner hospedado do GitHub o job roda na VM, sem container próprio:
          # `--network host` publica cada serviço em localhost, como os testes esperam.
          sufixo="$(hostname)"
          docker rm -f "test-postgres-$sufixo" "test-redpanda-$sufixo" "test-redpanda-sasl-$sufixo" \
            "test-floci-$sufixo" "test-keycloak-$sufixo" "test-redis-$sufixo" >/dev/null 2>&1 || true
          docker run -d --name "test-postgres-$sufixo" \
            --network host \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            "$IMAGEM_POSTGRES" \
            -c cluster_name=test

          # `--mode dev-container` agrupa as flags de desenvolvimento e `--smp 1` é
          # repassado ao binário (confirmado em v26.2.2 pelo exec logado); sem ele o
          # broker toma todos os cores do runner.
          docker run -d --name "test-redpanda-$sufixo" \
            --network host \
            "$IMAGEM_REDPANDA" \
            redpanda start --mode dev-container --smp 1

          # Segundo broker, que exige SASL SCRAM (IDN-04): prova que o cliente se
          # autentica e que o broker recusa quem não se autentica. Portas próprias
          # porque os contêineres dividem a rede do host.
          docker run -d --name "test-redpanda-sasl-$sufixo" \
            --network host \
            "$IMAGEM_REDPANDA" \
            redpanda start --mode dev-container --smp 1 \
            --advertise-kafka-addr sasl://localhost:19092 \
            --rpc-addr 0.0.0.0:43145 --advertise-rpc-addr localhost:43145 \
            --pandaproxy-addr 0.0.0.0:18082 --schema-registry-addr 0.0.0.0:18081 \
            --set 'redpanda.admin=[{"address":"0.0.0.0","port":19644}]' \
            --set 'redpanda.kafka_api=[{"name":"sasl","address":"0.0.0.0","port":19092,"authentication_method":"sasl"}]' \
            --set "redpanda.superusers=[\"${KAFKA_SASL_USERNAME}\"]" \
            --set redpanda.kafka_enable_authorization=true

          # SQS e SNS no mesmo emulador, para o hop SNS → SQS com raw delivery. As
          # filas e tópicos são criados pelo próprio teste de integração; o floci
          # aceita qualquer credencial não vazia, e /_floci/health lista os serviços.
          docker run -d --name "test-floci-$sufixo" \
            --network host \
            "$IMAGEM_FLOCI"

          if [ "$KEYCLOAK" = true ]; then
            docker run -d --name "test-keycloak-$sufixo" \
              --network host \
              -e KC_HOSTNAME=http://127.0.0.1:18180 \
              -e KC_HTTP_PORT=18180 \
              -e KC_HTTP_MANAGEMENT_PORT=19000 \
              -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
              -e DMPF_SESSION_EVENTS_SECRET=dmpf-test-session-events \
              -v "$PWD/infra/keycloak/dmpf-realm.json:/opt/keycloak/data/import/dmpf-realm.json:ro" \
              "$IMAGEM_KEYCLOAK" start --http-enabled=true --health-enabled=true --cache=local --db=dev-file --import-realm
          fi

          if [ "$REDIS" = true ]; then
            docker run -d --name "test-redis-$sufixo" \
              --network host \
              --tmpfs /data \
              "$IMAGEM_REDIS" \
              redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction \
              --user default off \
              --user revocation on '>ci-revocation' '~dmpf:revocation:*' \
              -@all +hello +auth '+client|setinfo' +ping +mget +evalsha +eval +get +set
          fi

      - name: Formatação e lint do Biome
        if: hashFiles('biome.json', 'biome.jsonc') != '' && steps.scope.outputs.biome != 'false'
        env:
          BIOME: ${{ steps.scope.outputs.biome }}
        run: |
          if [ "$BIOME" = global ]; then
            pnpm biome ci .
          else
            pnpm biome ci --changed --since="$NX_BASE" --no-errors-on-unmatched .
          fi

      # Sem a tag, um provider cujo `test-race` depende da infra sairia da fila serial e
      # disputaria a infra do job com os outros providers.
      - name: Toda lib Go declara exatamente uma camada
        if: steps.scope.outputs.layer == 'true'
        env:
          GRAFO: ${{ steps.scope.outputs.graph }}
          PROJECTS: ${{ steps.scope.outputs.projects }}
        run: |
          set -euo pipefail
          jq -r --arg p "$PROJECTS" '($p | split(",")) as $l | .graph.nodes[]
            | select((.name as $n | $l | index($n)) and (.data.tags | index("stack:go")) and (.data.root | startswith("tools/") | not))
            | [.name, ([.data.tags[] | select(startswith("layer:"))] | length)] | @tsv' "$GRAFO" \
            | awk -F'\t' '$2 != 1 { print "módulo Go com " $2 " tags layer:*: " $1; erro = 1 } END { exit erro }' >&2

      # Com o cache frio, `go list -m` não extrai o kernel; `go mod download` extrai.
      # O modo --context não verifica borda, deploy/infra.json nem banco e role em
      # infra/: a dmpf-scope pede o estrutural quando o diff os alcança.
      - name: DMPF context check
        if: steps.scope.outputs.context != ''
        env:
          CONTEXTOS: ${{ steps.scope.outputs.context }}
        run: |
          set -euo pipefail
          if [ "$DMPF_TOOLING_MODE" = version ]; then
            postgres=github.com/mateusmacedo/dmpf/libs/backend/go/postgres
            # Antes do primeiro contexto com provider, o postgres do kernel não está na build list.
            if go list -m "$postgres" > /dev/null 2>&1; then
              DMPF_KERNEL_DDL="$(go mod download -json "$postgres" | jq -r .Dir)"
            else
              DMPF_KERNEL_DDL=none
            fi
            export DMPF_KERNEL_DDL
          fi
          if [ "$CONTEXTOS" != global ]; then
            for contexto in $CONTEXTOS; do
              bash "$DMPF_PLUGIN_DIR/scripts/dmpf-context-check.sh" --context "$contexto"
            done
            exit 0
          fi
          # O consumidor recém-inicializado ainda não tem contexto; o platform sempre tem.
          vazio=()
          [ "$DMPF_TOOLING_MODE" = version ] && vazio=(--allow-empty)
          bash "$DMPF_PLUGIN_DIR/scripts/dmpf-context-check.sh" --phase structural "${vazio[@]}"

      - name: DMPF modsync gate
        if: steps.scope.outputs.modsync == 'true'
        run: go run "$DMPF_TOOLS/modsync$DMPF_TOOLS_VERSION" --root . --check

      - name: DMPF infrasync gate
        if: steps.scope.outputs.infrasync == 'true'
        run: go run "$DMPF_TOOLS/infrasync$DMPF_TOOLS_VERSION" --root . --check

      # GATE, fail-closed. O vencimento de exceção (DMPF-X006) muda sem diff: o
      # govulncheck.yml agendado roda este gate todo dia, fora do escopo do PR.
      - name: DMPF conformance gate
        if: steps.scope.outputs.conformance == 'true'
        run: go run "$DMPF_TOOLS/conformance$DMPF_TOOLS_VERSION" --root .

      # buf-breaking lê NX_BASE como baseline (contracts/README.md, "Gates e baseline"). Sem `test` nem
      # `vet` dos projetos Go: o `test-race` repete os pacotes do `test`, e o `govet` do golangci-lint é o `vet`.
      - name: Lint, typecheck, build, testes TypeScript e gates Buf
        if: steps.scope.outputs.projects != ''
        run: |
          set -euo pipefail
          read -ra escopo <<<"$NX_SCOPE"
          pnpm nx "${escopo[@]}" -t lint,typecheck,build,fmt-check,buf-lint,buf-pins,buf-generate-check,buf-breaking --parallel=3 --exclude="$NX_EXCLUDE"
          pnpm nx "${escopo[@]}" -t test --parallel=3 --exclude="$NX_EXCLUDE,tag:stack:go"

      - name: Esperar a infra de testes
        if: steps.scope.outputs.infra == 'true'
        env:
          KEYCLOAK: ${{ steps.scope.outputs.keycloak }}
          REDIS: ${{ steps.scope.outputs.redis }}
        run: |
          set -euo pipefail
          sufixo="$(hostname)"
          esperar() {
            local servico="$1" tentativas="$2"
            shift 2
            for _ in $(seq 1 "$tentativas"); do
              if "$@" >/dev/null 2>&1; then
                echo "$servico pronto ($sufixo)"
                return 0
              fi
              sleep 2
            done
            echo "$servico não respondeu em $((tentativas * 2))s" >&2
            docker logs "test-$servico-$sufixo" >&2
            return 1
          }
          redpanda_sasl_saudavel() {
            docker exec "test-redpanda-sasl-$sufixo" rpk cluster health -X admin.hosts=localhost:19644 | grep -q 'Healthy:.*true'
          }
          redis_responde() {
            docker exec "test-redis-$sufixo" redis-cli --no-auth-warning -u "$REDIS_URL" ping | grep -q PONG
          }

          esperar postgres 30 docker exec "test-postgres-$sufixo" pg_isready -U postgres -q
          esperar redpanda 30 docker exec "test-redpanda-$sufixo" rpk cluster info
          esperar redpanda-sasl 30 redpanda_sasl_saudavel
          docker exec "test-redpanda-sasl-$sufixo" rpk security user create "$KAFKA_SASL_USERNAME" -p "$KAFKA_SASL_PASSWORD" \
            --mechanism SCRAM-SHA-256 -X admin.hosts=localhost:19644
          esperar floci 30 curl -sf -o /dev/null "http://localhost:4566/_floci/health"

          if [ "$KEYCLOAK" = true ]; then
            esperar keycloak 60 curl -sf -o /dev/null "http://localhost:19000/health/ready"
            docker run --rm --network host \
              -e KEYCLOAK_URL=http://127.0.0.1:18180 \
              -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
              -v "$PWD/infra/keycloak/dev/seed.sh:/seed/seed.sh:ro" \
              --entrypoint bash "$IMAGEM_KEYCLOAK" /seed/seed.sh
            echo "KEYCLOAK_CALLBACK_HOST=127.0.0.1" >> "$GITHUB_ENV"
          fi

          if [ "$REDIS" = true ]; then
            esperar redis 30 redis_responde
          fi

      # Os providers cujo `test-race` depende da infra reiniciam tabelas e criam tópicos e
      # filas na infra compartilhada do job, então correm um por vez. As apps
      # ganham banco (<projeto>_test_<id>) e tópicos próprios e correm em paralelo.
      - name: Testes com race detector e integração
        if: steps.scope.outputs.projects != ''
        env:
          SERIAL: ${{ steps.scope.outputs.serial }}
        run: |
          set -euo pipefail
          read -ra escopo <<<"$NX_SCOPE"
          if [ -n "$SERIAL" ]; then
            pnpm nx run-many -t test-race -p "$SERIAL" --parallel=1
          fi
          # O `dependsOn` de `app` e `testkit` arrastaria de novo o `test-race` do `postgres`, que a
          # série já rodou; o `test-infra-up` que sai junto é no-op no CI, cuja infra é a do job.
          pnpm nx "${escopo[@]}" -t test-race --parallel=3 --exclude="$NX_EXCLUDE${SERIAL:+,$SERIAL}" --excludeTaskDependencies
          pnpm nx "${escopo[@]}" -t test-integration,e2e --parallel=1 --exclude="$NX_EXCLUDE"

      - name: Go vulnerabilities
        if: inputs.govulncheck && steps.scope.outputs.go == 'true'
        run: |
          read -ra escopo <<<"$NX_SCOPE"
          pnpm nx "${escopo[@]}" -t govulncheck --parallel=3 --exclude="$NX_EXCLUDE"

      - name: DMPF generator check (structural)
        if: inputs.platform && steps.scope.outputs.generator == 'true'
        run: bash tools/dmpf-generator-check.sh --phase structural

      # A infra genérica, o .golangci.yml, os ativos de IA e o setup Go do platform
      # são saída do init: um dry-run que proponha mudança é divergência com os templates.
      - name: DMPF init sem diff no platform
        if: inputs.platform && steps.scope.outputs.init == 'true'
        run: |
          set -euo pipefail
          saida="$(pnpm nx g @mateusmacedo/dmpf-plugin:init --dry-run --no-interactive 2>&1)"
          printf '%s\n' "$saida"
          if grep -qE '^(CREATE|UPDATE|DELETE) ' <<<"$saida"; then
            echo "init propõe mudança no platform: os templates divergem da infra versionada" >&2
            exit 1
          fi

      - name: Pins do versions.json iguais às fontes
        if: inputs.platform && steps.scope.outputs.versions == 'true'
        run: node tools/dmpf-plugin/scripts/sync-versions.mjs --check

      # O verificador de dashboards descarta fixtures com `trash`.
      - name: Instalar trash-cli
        if: inputs.platform && steps.scope.outputs.observability == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends trash-cli

      - name: Grafana provisioning e OTel env
        if: inputs.platform && steps.scope.outputs.observability == 'true'
        run: |
          bash tools/grafana-provisioning-check.sh
          bash tools/otel-env-check.sh

      # O nome dos containers leva o id do job, então o `docker rm -f` antes da
      # subida nunca alcança o resíduo de um job anterior; quem limpa é este.
      - name: Derrubar a infraestrutura do job
        if: always() && steps.scope.outputs.infra == 'true'
        run: docker rm -f "test-postgres-$(hostname)" "test-redpanda-$(hostname)" "test-redpanda-sasl-$(hostname)" "test-floci-$(hostname)" "test-keycloak-$(hostname)" "test-redis-$(hostname)" >/dev/null 2>&1 || true

  # Os vetores negativos provam o verificador, não o código: correm em job próprio,
  # em paralelo ao `DMPF`, para não somar o tempo deles ao do job principal.
  self-tests:
    name: Vetores negativos
    if: inputs.self-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Origem do workflow reutilizável
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "job.workflow_sha vazio: as actions viriam da branch default do DMPF" >&2
            exit 1
          fi

      - name: Checkout das actions do DMPF
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .dmpf-ci
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Credencial do GitHub Packages no .npmrc de usuário
        run: |
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Setup Node and pnpm
        uses: ./.dmpf-ci/.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}

      - name: Layout DMPF
        uses: ./.dmpf-ci/.github/actions/dmpf-layout
        with:
          plugin-version: ${{ inputs.plugin-version }}

      - name: Setup Go
        uses: ./.dmpf-ci/.github/actions/setup-go
        with:
          go-version: ${{ inputs.go-version }}
          versions-file: ${{ env.DMPF_PLUGIN_DIR }}/versions.json
          go-sum-paths: |
            ${{ env.DMPF_APPS_DIR }}/**/go.sum
            libs/**/go.sum
            tools/**/go.sum

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: ${{ inputs.base || github.event.repository.default_branch }}
          fallback-sha: ${{ github.event.before }}

      - name: Escopo do diff
        id: scope
        uses: ./.dmpf-ci/.github/actions/dmpf-scope

      # Prova que o gate de dependência do bloco domain continua reprovando o
      # que deve reprovar; sem rodar, o vetor negativo não protege de regressão.
      - name: DMPF dependency gate (self-test)
        if: steps.scope.outputs.gate-check == 'true'
        run: bash "$DMPF_PLUGIN_DIR/scripts/dmpf-gate-check.sh"

      - name: Gates Buf (self-test)
        if: steps.scope.outputs.projects != ''
        run: |
          read -ra escopo <<<"$NX_SCOPE"
          pnpm nx "${escopo[@]}" -t buf-gate-selftest --parallel=3 --exclude="$NX_EXCLUDE"

      # Os self-tests descartam fixtures com `trash`.
      - name: Instalar trash-cli
        if: inputs.platform && steps.scope.outputs.self-tests != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends trash-cli

      # Célula e shared kernel são arestas entre unidades que nem o depguard nem
      # o `--root .` exercitam enquanto não há consumidor do kernel (C2, DMPF-M004).
      # Cada prova monta a fixture no próprio diretório temporário ou worktree, então correm juntas.
      - name: Vetores negativos dos gates do platform (self-test)
        if: inputs.platform && steps.scope.outputs.self-tests != ''
        env:
          VETORES: ${{ steps.scope.outputs.self-tests }}
        run: |
          set -uo pipefail
          declare -A provas=(
            [cell]="bash tools/dmpf-cell-check.sh"
            [shared-kernel]="bash tools/dmpf-shared-kernel-check.sh"
            [generator]="bash tools/dmpf-generator-check.sh --phase self-test"
            [context]="bash tools/dmpf-plugin/scripts/dmpf-context-check.sh --phase self-test"
            [grafana]="bash tools/grafana-provisioning-check.sh --self-test"
            [otel]="bash tools/otel-env-check.sh --self-test"
            # Com PG_DSN o harness acrescenta test-race e test-distributed num worktree,
            # que o job DMPF já cobre; sem ele, prova só que o gate normativo reprova.
            [harness]="env -u PG_DSN bash tools/dmpf-harness-check.sh --phase self-test"
            [scope]="bash tools/dmpf-scope-check.sh --self-test"
          )
          read -ra ordem <<<"$VETORES"
          declare -A pids
          for prova in "${ordem[@]}"; do
            read -ra comando <<<"${provas[$prova]}"
            "${comando[@]}" > "$RUNNER_TEMP/self-test-$prova.log" 2>&1 &
            pids[$prova]=$!
          done
          falhou=0
          for prova in "${ordem[@]}"; do
            resultado=ok
            wait "${pids[$prova]}" || { resultado=FALHA; falhou=1; }
            echo "::group::$prova ($resultado)"
            cat "$RUNNER_TEMP/self-test-$prova.log"
            echo "::endgroup::"
            [ "$resultado" = ok ] || echo "::error title=Vetores negativos::$prova reprovou"
          done
          exit "$falhou"
