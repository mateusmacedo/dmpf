# CD EKS monorepo (Modelo A): detect-apps → deploy-eks (um job por app).
# Consumidor fino dos templates; sem build/push/GitOps inline.
#
# ── TEMPLATE, NÃO LIGADO ──────────────────────────────────────────────────────
# Este workflow vem propositalmente incompleto: o template não tem apps, e um CD
# ativo aqui faria deploy de nada. Para habilitar no seu projeto:
#
#   1. Descomente o bloco `push:` em `on:` quando quiser deploy automático a
#      partir de `develop`.
#   2. Acrescente um job `deploy-<app>` por app deployável, a partir do exemplo
#      em docs/ci-cd/DEPLOY_APPLICATIONS.md («Como o Modelo A resolve nomes»).
#   3. Configure a var `AWS_ACCOUNT_ID` no repositório.
#   4. Faça o primeiro smoke por `workflow_dispatch` em `dev`, depois em `hmg`.
#
# Guia completo: docs/ci-cd/DEPLOY_APPLICATIONS.md
name: CD Dev/Hmg

on:
  # Descomente para deploy automático a partir de `develop`:
  # push:
  #   branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de deploy
        type: choice
        default: dev
        options:
          - dev
          - hmg
      app:
        description: "Path da app (ex: apps/backend/<app>). Vazio = detectadas"
        type: string
        required: false

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  detect:
    if: inputs.app == ''
    uses: ./.github/workflows/detect-apps.yaml
