name: CI

# Sem push em develop: o Nx Cloud guarda o cache entre execuções. Sem
# paths-ignore: o job `CI` é o check obrigatório e precisa reportar em todo PR,
# inclusive no só de documentação, em que ele aprova sem rodar o resto.
on:
  pull_request:
    branches:
      - master
      - develop
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Declarado aqui, e não herdado do runner: é o que faz tb.Env reprovar
  # em vez de pular quando uma variável de integração falta.
  CI: "true"

jobs:
  scope:
    name: Escopo
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
      self-tests: ${{ steps.scope.outputs.self-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # O PR para master vem de release/** ou hotfix/** e leva o pacote completo.
      # Markdown sob tools/, .claude/ e .agents/ é saída do init e não conta como
      # documentação: alterá-lo faz o `init --dry-run` propor mudança.
      - name: Classificar o diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mudados="$(git diff --name-only "$BASE_SHA"...HEAD)"
          codigo="$(awk '!/^docs\// && !(/\.md$/ && !/^(tools|\.claude|\.agents)\//)' <<<"$mudados")"
          ferramental="$(grep -E '^(tools/|\.github/|\.golangci\.yml$)' <<<"$mudados" || true)"
          full=false
          [ "$BASE_REF" = master ] && full=true
          {
            echo "full=$full"
            echo "code=$([ "$full" = true ] || [ -n "$codigo" ] && echo true || echo false)"
            echo "self-tests=$([ "$full" = true ] || [ -n "$ferramental" ] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  dmpf:
    name: DMPF
    needs: scope
    if: needs.scope.outputs.code == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/dmpf-go-ci.yml
    with:
      base: ${{ github.base_ref }}
      keycloak: true
      platform: true
      full: ${{ needs.scope.outputs.full == 'true' }}
      self-tests: ${{ needs.scope.outputs.self-tests == 'true' }}
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

  external-consumer:
    name: Consumidor externo por versão
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Prova do consumidor externo
        run: bash tools/external-consumer.sh --verdaccio

  distributed:
    name: Distribuído
    needs: scope
    if: needs.scope.outputs.full == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/dmpf-distributed.yml

  sonar:
    name: SonarQube Cloud
    needs: scope
    if: needs.scope.outputs.full == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Único check obrigatório do ruleset: pulado conta como aprovado, porque o
  # escopo só pula o que não se aplica ao PR; falha ou cancelamento reprova.
  ci:
    name: CI
    needs: [scope, dmpf, external-consumer, distributed, sonar]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Resultado dos jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
