name: CI

on:
  pull_request:
    branches:
      - master
      - develop
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: Nx Affected Pipeline
    runs-on: gitea-runner
    timeout-minutes: 30
    env:
      NX_EXCLUDE: "@nx-base-template/source"
      DMPF_PG_DSN: "postgres://dmpf:dmpf@localhost:5432/dmpf?sslmode=disable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@v5

      # O bloco `services:` não serve aqui: o act_runner põe serviço e job na
      # bridge default do Docker, que não resolve nome de container, e declara
      # ignorar rede customizada. Compartilhar o namespace de rede do próprio job
      # dispensa DNS, IP de gateway e porta publicada — ver ADR-035.
      - name: Subir Postgres para os testes de integração
        run: |
          set -euo pipefail
          # O nome carrega o id do container do job porque o socket do Docker vem
          # do host: um nome fixo colidiria entre jobs concorrentes, ou com o
          # resíduo de um job morto sem limpeza.
          nome="dmpf-postgres-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network "container:$(hostname)" \
            -e POSTGRES_USER=dmpf -e POSTGRES_PASSWORD=dmpf -e POSTGRES_DB=dmpf \
            postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec "$nome" pg_isready -U dmpf -q; then
              echo "postgres pronto em localhost:5432 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres nao respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      - name: Check formatting and linting
        run: pnpm biome ci .

      - name: Lint (affected)
        run: pnpm nx affected -t lint --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: Test (affected)
        run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3 --ci --coverage --exclude=$NX_EXCLUDE

      - name: Build (affected)
        run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      # lint, test e build já passam pelos steps acima; aqui ficam os quatro
      # passos da cadeia Go que nenhum deles cobre.
      - name: Go gates (affected)
        run: pnpm nx affected -t fmt-check,vet,test-race,govulncheck --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      # O gate roda o golangci-lint uma vez por vetor, então fica sob o mesmo
      # regime de `affected` do resto do pipeline: um PR só de TypeScript não
      # paga por ele.
      - name: Detect affected Go projects
        id: go_affected
        run: |
          lista="$(pnpm nx show projects --affected --base=$NX_BASE --head=$NX_HEAD --projects=tag:stack:go | tr -d '[:space:]')"
          if [ -n "$lista" ] && [ "$lista" != "[]" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Prova que o gate de dependência do bloco domain continua reprovando o
      # que deve reprovar; sem rodar, o vetor negativo não protege de regressão.
      - name: DMPF dependency gate
        if: steps.go_affected.outputs.any == 'true'
        run: bash tools/dmpf-gate-check.sh

      # Complementa o step acima onde o depguard não alcança: ele decide por nome
      # de diretório, e célula é aresta entre unidades, que só o verificador vê.
      - name: DMPF cell gate
        if: steps.go_affected.outputs.any == 'true'
        run: bash tools/dmpf-cell-check.sh

      # GATE, fail-closed. Sem `continue-on-error` e sem `|| true`: a partir
      # daqui o verificador reprova o PR. O passo shadow que existia aqui foi
      # removido NESTE MESMO COMMIT, para que não exista estado em que os dois
      # convivam e o resultado dependa de qual deles alguém leu.
      #
      # `--base` entrega o intervalo em revisão, que o mecanismo mínimo de
      # RFC §10.2 precisa para avaliar se a mudança normativa veio em commit
      # próprio. Sem ele, a condição fica "não verificada" — e não verificada
      # reprova.
      - name: DMPF conformance gate
        if: steps.go_affected.outputs.any == 'true'
        run: |
          go run ./libs/backend/go/dmpf-conformance/cmd/dmpf-conformance --root . --base "$NX_BASE"

      # Gates Buf dos contratos (contracts/README.md, "Gates e baseline"): só o
      # dmpf-contracts-go os declara, com contracts/** nos inputs, então um PR que
      # toque só um .proto entra no affected; buf-breaking lê NX_BASE como baseline.
      #
      # Roda DEPOIS dos gates DMPF: a falha deste step abortava o job e deixava os
      # dois em skipped, suprimindo o gate autoritativo da regra de dependência
      # justamente nos PRs que classificam unidade nova. Segue fail-closed e sem
      # bypass, como BUF-12 exige — só deixou de sequestrar a execução dos outros.
      - name: Contracts gates (affected)
        run: pnpm nx affected -t buf-lint,buf-pins,buf-generate-check,buf-breaking,buf-gate-selftest --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: E2E (affected)
        run: pnpm nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD --parallel=1 --exclude=$NX_EXCLUDE
