name: NX Release

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type (affects docker versioning)"
        type: choice
        options:
          - production
          - hotfix
        default: production
      version:
        description: "Versão explícita para todos os projetos (ex.: 1.0.0-rc.0); vazio deriva dos commits"
        type: string
        required: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Nx Release (version, changelog, tags)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          startsWith(github.event.pull_request.head.ref, 'release/') ||
          startsWith(github.event.pull_request.head.ref, 'hotfix/')
        )
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version_sha: ${{ steps.push.outputs.version_sha }}
      has_npm: ${{ steps.push.outputs.has_npm }}
      dist_tag: ${{ steps.push.outputs.dist_tag }}
      plugin_version: ${{ steps.push.outputs.plugin_version }}
    # O `prepare` do pnpm instala o lefthook no runner, e o pre-push dele roda
    # `test-race` sem a infra de testes: sem isto o push da release aborta.
    env:
      LEFTHOOK: "0"

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manual dispatch branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "::error::Manual release is allowed only from master. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # O nome resolvido aqui (production | hotfix) é o que `--dockerVersionScheme`
      # recebe no step "Release — docker apps". O conteúdo do esquema NÃO vive mais
      # em `release.docker` na raiz do nx.json — lá ele contamina todo release group
      # e força `requireSemver: false`, o que faz a versão ser lida como o nome do
      # projeto (SPEC-95AHV4D4, requisito "release.docker fora da raiz"). Hoje o
      # step Docker não tem candidato (toda app é Go); a primeira app não-Go
      # declara `release.docker.versionSchemes.{production,hotfix}` no seu próprio
      # release group, senão o flag abaixo não resolve nenhum template.
      - name: Resolve docker version scheme
        id: docker-scheme
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MANUAL_TYPE: ${{ inputs.release-type }}
        run: |
          if [[ "$HEAD_REF" == hotfix/* ]] || [[ "$MANUAL_TYPE" == "hotfix" ]]; then
            echo "value=hotfix" >> "$GITHUB_OUTPUT"
          else
            echo "value=production" >> "$GITHUB_OUTPUT"
          fi

      # Sem projeto com tag:type:lib o nx release sai com exit 1 ("Release group
      # \"<nome>\" matches no projects"), não vazio — e com os grupos nomeados do
      # nx.json (go-libs, go-contract-*, go-tools, npm) cada um precisa casar ao
      # menos um projeto.
      # Esta detecção é o que mantém o pipeline ocioso — mesmo padrão dos
      # candidatos Docker abaixo.
      - name: Detect lib release candidates
        id: lib-candidates
        run: |
          LIBS_JSON=$(pnpm --silent nx show projects --projects="tag:type:lib" --json)
          LIBS_COUNT=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.length : 0);" "$LIBS_JSON")

          if [[ "$LIBS_COUNT" -gt 0 ]]; then
            echo "has_libs=true" >> "$GITHUB_OUTPUT"
            echo "Versioning enabled for tag:type:lib projects: $LIBS_JSON"
          else
            echo "has_libs=false" >> "$GITHUB_OUTPUT"
            echo "No projects found for tag:type:lib. Skipping version and push steps."
          fi

      # Versiona (bump + changelog + commit + tag) SEM publicar e SEM empurrar. A
      # publicação no GitHub Packages roda no job `publish`, encadeado a este: a tag
      # empurrada com o GITHUB_TOKEN não dispara outro workflow.
      # --yes e --skip-publish são mutuamente exclusivos no Nx; usar só skip-publish.
      # Sem continue-on-error: falha real do nx release NÃO deve empurrar tags.
      #
      # A detecção de primeira release olha os padrões das PRÓPRIAS famílias de
      # release, nunca `*@*`: a tag do produto `dmpf@X.Y.Z` casa esse glob e
      # mascararia a primeira release das libs, que nunca receberia
      # --first-release. As famílias são as quatro declaradas em nx.json:
      # `libs/backend/go/<lib>/vX.Y.Z`, `apps/backend/<ctx>/contract/vX.Y.Z`,
      # `tools/dmpf-conformance/vX.Y.Z` e o npm `<projeto>@X.Y.Z` (com `dmpf@*`
      # excluído).
      - name: Nx Release (skip publish)
        if: steps.lib-candidates.outputs.has_libs == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          GO_TAGS=$(git tag -l 'libs/backend/go/*/v*' 'apps/backend/*/contract/v*' 'tools/dmpf-conformance/v*' | head -n 1)
          NPM_TAGS=$(git tag -l '*@*' | grep -v '^dmpf@' | head -n 1 || true)

          # A estreia leva a versão EXPLÍCITA: sem tag das famílias o resolver
          # cai no fallback `disk` (0.0.0), e os `require` dos go.mod já apontam
          # v0.1.0 (ADR-047). A guarda é por família, não por projeto.
          FIRST_VERSION="0.1.0"

          VERSION_ARGS=""
          ALVO=""
          if [ -z "$GO_TAGS" ] && [ -z "$NPM_TAGS" ]; then
            echo "Nenhuma tag das famílias de release existente; primeira release em $FIRST_VERSION."
            VERSION_ARGS="$FIRST_VERSION --first-release"
            ALVO="$FIRST_VERSION"
          elif [ -n "${MANUAL_VERSION:-}" ]; then
            if [[ ! "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Input version '$MANUAL_VERSION' não é semver."
              exit 1
            fi
            echo "Versão explícita $MANUAL_VERSION informada no dispatch para todos os projetos."
            VERSION_ARGS="$MANUAL_VERSION"
            ALVO="$MANUAL_VERSION"
          elif [[ "${HEAD_REF:-}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+)$ ]]; then
            echo "Branch de pré-release $HEAD_REF; versão explícita ${BASH_REMATCH[1]} para todos os projetos."
            VERSION_ARGS="${BASH_REMATCH[1]}"
            ALVO="${BASH_REMATCH[1]}"
          fi

          # O versions.json entra no commit de versão: o nx release commita o que
          # estiver no stage. Kernel e conformance numa versão só pedem versão explícita.
          FONTE="$(git rev-parse HEAD)"
          if [ -n "$ALVO" ]; then
            node tools/dmpf-plugin/scripts/sync-versions.mjs --target "$ALVO" --workflow-ref "$FONTE"
          else
            echo "::warning::Versão derivada dos commits: o versions.json mantém kernel, conformance e migrations e só recebe o workflowRef."
            node tools/dmpf-plugin/scripts/sync-versions.mjs --workflow-ref "$FONTE"
          fi
          git add tools/dmpf-plugin/versions.json tools/dmpf-plugin/migrations.json

          # Snapshot para empurrar depois SÓ as tags criadas nesta execução.
          git tag | sort > /tmp/tags-before.txt

          pnpm nx release $VERSION_ARGS --skip-publish

      # Empurra o commit de release e apenas as tags que esta execução criou. Um
      # `git push --follow-tags` arrastaria qualquer tag anotada alcançável.
      - name: Push version commit and tags
        id: push
        if: steps.lib-candidates.outputs.has_libs == 'true'
        run: |
          set -euo pipefail
          git tag | sort > /tmp/tags-after.txt
          comm -13 /tmp/tags-before.txt /tmp/tags-after.txt > /tmp/tags-new.txt

          echo "Tags criadas nesta execução:"
          cat /tmp/tags-new.txt

          git push origin master
          if [ -s /tmp/tags-new.txt ]; then
            xargs -r -a /tmp/tags-new.txt git push origin
          fi

          # Tags npm são `<projeto>@<versão>`; as de módulo Go não levam `@`. Uma
          # pré-release publica em `next`, para não virar a `latest` de quem instala.
          npm_versoes="$(grep '@' /tmp/tags-new.txt | sed 's/.*@//' || true)"
          plugin="$(grep '^@mateusmacedo/dmpf-plugin@' /tmp/tags-new.txt || true)"
          {
            echo "version_sha=$(git rev-parse HEAD)"
            if [ -z "$npm_versoes" ]; then
              echo "has_npm=false"
            elif [[ "$npm_versoes" == *-* ]]; then
              echo "has_npm=true"
              echo "dist_tag=next"
            else
              echo "has_npm=true"
              echo "dist_tag=latest"
            fi
            echo "plugin_version=${plugin##*@}"
          } >> "$GITHUB_OUTPUT"

      # Módulos Go não geram imagem por aqui: a imagem é matéria do golden path
      # (ADR-041), e um `type:app` Go sem Dockerfile quebraria o build. Mesmo
      # precedente do `build_projects_filter` de `nx-publish-libs.yml`.
      - name: Detect docker release candidates
        id: docker-candidates
        run: |
          APPS_JSON=$(pnpm --silent nx show projects --projects="tag:type:app,!tag:stack:go" --json)
          APPS_COUNT=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.length : 0);" "$APPS_JSON")
          APPS_CSV=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.join(',') : '');" "$APPS_JSON")

          if [[ "$APPS_COUNT" -gt 0 ]]; then
            echo "has_docker_apps=true" >> "$GITHUB_OUTPUT"
            echo "projects_csv=$APPS_CSV" >> "$GITHUB_OUTPUT"
            echo "Docker release enabled for projects: $APPS_CSV"
          else
            echo "has_docker_apps=false" >> "$GITHUB_OUTPUT"
            echo "projects_csv=" >> "$GITHUB_OUTPUT"
            echo "No docker release candidates found for tag:type:app,!tag:stack:go. Skipping Docker steps."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release — docker apps
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_CSV: ${{ steps.docker-candidates.outputs.projects_csv }}
          DOCKER_SCHEME: ${{ steps.docker-scheme.outputs.value }}
        run: pnpm nx release --projects="$PROJECTS_CSV" --dockerVersionScheme="$DOCKER_SCHEME" --yes

  publish:
    name: Publicar as libs npm no GitHub Packages
    needs: version
    if: needs.version.outputs.has_npm == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-libs.yaml
    with:
      pnpm_version: ""
      node_version: "24"
      nx_exclude: "@mateusmacedo/dmpf-source"
      scope: "@mateusmacedo"
      tag: ${{ needs.version.outputs.dist_tag }}
      build_projects_filter: "tag:type:lib,!tag:stack:go"
      ref: ${{ needs.version.outputs.version_sha }}

  # Falha aqui marca o run como vermelho, sem rollback: a release já foi publicada.
  consumer:
    name: Consumidor externo da release
    needs: [version, publish]
    if: needs.version.outputs.plugin_version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLUGIN_VERSION: ${{ needs.version.outputs.plugin_version }}
    steps:
      - name: Checkout do commit de versão
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.version_sha }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Consumidor puro da versão publicada
        run: bash tools/external-consumer.sh --plugin-version "$PLUGIN_VERSION"

      # A anterior vem do registry, não das tags: uma release antiga pode ter
      # criado a tag do plugin sem publicá-lo.
      - name: Versão anterior publicada do plugin
        id: anterior
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/npmrc"
          printf '%s\n' '@mateusmacedo:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
          versoes="$(NPM_CONFIG_USERCONFIG="$npmrc" npm view @mateusmacedo/dmpf-plugin versions --json)"
          anterior="$(node -e '
            const semver = require(require.resolve("semver", { paths: [require.resolve("nx/package.json")] }));
            const [lista, atual] = process.argv.slice(1);
            const anteriores = [].concat(JSON.parse(lista)).filter((v) => semver.lt(v, atual));
            console.log(semver.maxSatisfying(anteriores, "*", { includePrerelease: true }) ?? "");
          ' "$versoes" "$PLUGIN_VERSION")"
          echo "versao=$anterior" >> "$GITHUB_OUTPUT"

      - name: Upgrade da versão anterior pelas migrations
        if: steps.anterior.outputs.versao != ''
        env:
          PREVIOUS_PLUGIN_VERSION: ${{ steps.anterior.outputs.versao }}
        run: bash tools/external-consumer.sh --plugin-version "$PLUGIN_VERSION" --upgrade-from "$PREVIOUS_PLUGIN_VERSION"
