name: DMPF Distributed

# Camada distribuída da pirâmide (FND-09 KIT-06): dois processos OS sobre
# Redpanda e Postgres, com reentrega deliberada (V32). Pipeline separado por KIT-11:
# o ci.yml só o chama no PR para master, com test-distributed no escopo (ADR-071).
on:
  workflow_call:
    inputs:
      projects:
        description: Projetos do escopo do diff, separados por vírgula; vazio roda todos os que têm test-distributed
        type: string
        default: ""
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  distributed:
    name: Reentrega deliberada sobre o broker (V32)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CI: "true"
      PG_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      KAFKA_BROKERS: "localhost:9092"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Projetos com harness distribuído
        id: alvo
        env:
          PROJECTS: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          filtro=()
          [ -n "$PROJECTS" ] && filtro=(-p "$PROJECTS")
          lista="$(pnpm --silent nx show projects --withTarget test-distributed "${filtro[@]}" --json | jq -r 'join(",")')"
          echo "projects=$lista" | tee -a "$GITHUB_OUTPUT"

      - name: Espelho do Docker Hub
        if: steps.alvo.outputs.projects != ''
        uses: ./.github/actions/docker-hub-mirror

      - name: Imagens da infra de testes
        if: steps.alvo.outputs.projects != ''
        run: |
          set -euo pipefail
          servicos="$(docker compose -f infra/test/compose.yml config --format json)"
          for par in POSTGRES:postgres REDPANDA:redpanda; do
            imagem="$(jq -r --arg s "${par#*:}" '.services[$s].image // empty' <<<"$servicos")"
            [[ $imagem =~ ^[a-z0-9][a-z0-9./_:-]*@sha256:[0-9a-f]{64}$ ]] ||
              { echo "infra/test/compose.yml sem imagem fixada por digest para ${par#*:}: '$imagem'" >&2; exit 1; }
            echo "IMAGEM_${par%%:*}=$imagem" >> "$GITHUB_ENV"
          done

      # No runner hospedado do GitHub o job roda na VM, sem container próprio:
      # `--network host` publica o serviço em localhost, como os testes esperam.
      - name: Subir Postgres para o harness distribuído
        if: steps.alvo.outputs.projects != ''
        run: |
          set -euo pipefail
          nome="test-dist-postgres-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network host \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            "$IMAGEM_POSTGRES" \
            -c cluster_name=test
          for _ in $(seq 1 30); do
            if docker exec "$nome" pg_isready -U postgres -q; then
              echo "postgres pronto em localhost:5432 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres nao respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      - name: Subir Redpanda para o harness distribuído
        if: steps.alvo.outputs.projects != ''
        run: |
          set -euo pipefail
          nome="test-dist-redpanda-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network host \
            "$IMAGEM_REDPANDA" \
            redpanda start --mode dev-container --smp 1
          for _ in $(seq 1 30); do
            if docker exec "$nome" rpk cluster info >/dev/null 2>&1; then
              echo "redpanda pronto em localhost:9092 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "redpanda nao respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      # O target declara `dependsOn` no `test-race` do provider Postgres e do
      # app, então o harness só roda depois que as duas camadas de que
      # depende passaram.
      - name: Harness distribuído (KIT-06)
        if: steps.alvo.outputs.projects != ''
        env:
          PROJECTS: ${{ steps.alvo.outputs.projects }}
        run: pnpm nx run-many -t test-distributed -p "$PROJECTS" --parallel=1

      - name: Derrubar a infraestrutura do job
        if: always()
        run: docker rm -f "test-dist-postgres-$(hostname)" "test-dist-redpanda-$(hostname)" >/dev/null 2>&1 || true
