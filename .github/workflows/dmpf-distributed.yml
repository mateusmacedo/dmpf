name: DMPF Distributed

# Camada distribuída da pirâmide (FND-09 KIT-06): dois processos OS sobre
# Redpanda e Postgres, com reentrega deliberada (V32). Pipeline separado do
# ciclo curto por exigência de KIT-11. Sem `paths` positivo: o efeito sob
# reentrega depende do kernel inteiro, e um filtro por caminho esconderia a
# regressão que vier de fora do `distkit`; só o PR exclusivamente de
# documentação fica de fora, como no ci.yml.

on:
  pull_request:
    branches:
      - master
      - develop
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  distributed:
    name: Reentrega deliberada sobre o broker (V32)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CI: "true"
      DMPF_PG_DSN: "postgres://dmpf:dmpf@localhost:5432/dmpf?sslmode=disable"
      DMPF_KAFKA_BROKERS: "localhost:9092"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # No runner hospedado do GitHub o job roda na VM, sem container próprio:
      # `--network host` publica o serviço em localhost, como os testes esperam.
      - name: Subir Postgres para o harness distribuído
        run: |
          set -euo pipefail
          nome="dmpf-dist-postgres-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network host \
            -e POSTGRES_USER=dmpf -e POSTGRES_PASSWORD=dmpf -e POSTGRES_DB=dmpf \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          for _ in $(seq 1 30); do
            if docker exec "$nome" pg_isready -U dmpf -q; then
              echo "postgres pronto em localhost:5432 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres nao respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      - name: Subir Redpanda para o harness distribuído
        run: |
          set -euo pipefail
          nome="dmpf-dist-redpanda-$(hostname)"
          docker rm -f "$nome" >/dev/null 2>&1 || true
          docker run -d --name "$nome" \
            --network host \
            redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96 \
            redpanda start --mode dev-container --smp 1
          for _ in $(seq 1 30); do
            if docker exec "$nome" rpk cluster info >/dev/null 2>&1; then
              echo "redpanda pronto em localhost:9092 ($nome)"
              exit 0
            fi
            sleep 2
          done
          echo "redpanda nao respondeu em 60s" >&2
          docker logs "$nome" >&2
          exit 1

      # O target declara `dependsOn` no `test-race` do provider Postgres e do
      # app, então o harness só roda depois que as duas camadas de que
      # depende passaram sobre a mesma infra.
      - name: Harness distribuído (KIT-06)
        run: pnpm nx run reservations:test-distributed

      - name: Derrubar a infraestrutura do job
        if: always()
        run: docker rm -f "dmpf-dist-postgres-$(hostname)" "dmpf-dist-redpanda-$(hostname)" >/dev/null 2>&1 || true
