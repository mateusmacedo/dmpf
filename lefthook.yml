pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # gofmt -l lista os arquivos fora do padrão mas sai com 0; e, diante de erro
    # de sintaxe, escreve em stderr e sai 2 com stdout VAZIO — um `test -z` no
    # lugar daria sucesso justamente no arquivo que nem compila. Por isso saída e
    # status são guardados em separado. Reprova em vez de reescrever: o autor vê
    # o que está fora do formato antes de o commit entrar.
    gofmt:
      glob: "*.go"
      run: saida="$(gofmt -l {staged_files} 2>&1)"; status=$?; [ $status -eq 0 ] || { printf '%s\n' "$saida" >&2; exit $status; }; [ -z "$saida" ] || { printf '%s\n' "$saida" >&2; exit 1; }

pre-push:
  commands:
    # Sem test-race, build e govulncheck: os testes de integração dependem de
    # Docker e levam minutos, o que derruba o push por ociosidade; ficam no CI.
    # A base é o que o remoto já tem, não o defaultBase (master): o push só
    # verifica o que ele leva. Branch sem upstream compara com origin/develop.
    affected:
      run: |
        base="$(git rev-parse --verify --quiet '@{push}' || git merge-base HEAD origin/develop)" || exit 1
        pnpm nx affected -t lint,typecheck,fmt-check,test --base="$base" --head=HEAD --parallel=3 --exclude=@mateusmacedo/dmpf-source
