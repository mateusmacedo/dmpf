apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Contexto orders: api gRPC e relay como Deployments de uma mesma imagem. O
# Secret `orders` (DMPF_PG_DSN do banco dmpf_orders,
# DMPF_KAFKA_BROKERS) vem do overlay — a base não conhece credencial nenhuma.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: orders
      app.kubernetes.io/part-of: dmpf

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment-api.yaml
  - deployment-relay.yaml
  - service-api.yaml
  - pdb-api.yaml
  - networkpolicy.yaml
