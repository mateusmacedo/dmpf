apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: bookings
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mateusmacedo/bookings:latest
          args: ['--role', 'api']
          ports:
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: bookings
            - secretRef:
                name: bookings
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Prontidão pelo health do serviço, que só vira SERVING com o banco
          # alcançado; vivacidade pelo status geral, que não depende do banco.
          readinessProbe:
            grpc:
              port: 9090
              service: company.bookings.service.v1.BookingsService
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 15
