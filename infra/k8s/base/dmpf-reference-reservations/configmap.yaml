# Valores não sensíveis dos três papéis: o consumer lê o canal de orders, o
# relay publica no de reservations. Os opt-outs de TLS nascem desligados e o
# transporte gRPC não tem default: o overlay declara um dos dois modos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmpf-reference-reservations
data:
  DMPF_SERVICE: dmpf-reference-reservations
  DMPF_GRPC_ADDR: ':9090'
  DMPF_KAFKA_ORDERS_TOPIC: orders.events
  DMPF_KAFKA_ORDERS_DLQ: orders.events.dlq
  DMPF_KAFKA_RESERVATIONS_TOPIC: reservations.events
  DMPF_KAFKA_RESERVATIONS_DLQ: reservations.events.dlq
  DMPF_KAFKA_GROUP: reservations
  DMPF_KAFKA_INSECURE: 'false'
  DMPF_OTLP_ENDPOINT: otel-collector:4317
  DMPF_OTLP_INSECURE: 'false'
