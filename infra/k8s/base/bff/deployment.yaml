apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app.kubernetes.io/component: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bff
    spec:
      serviceAccountName: bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: ghcr.io/mateusmacedo/bff:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bff
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # O BFF não expõe rota de saúde: a sonda é o socket.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 15
