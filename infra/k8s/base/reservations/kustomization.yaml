apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Contexto reservations: api gRPC, relay e consumer como Deployments de uma
# mesma imagem. O Secret `reservations` (DMPF_PG_DSN do banco
# dmpf_reservations, DMPF_KAFKA_BROKERS) vem do overlay.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: reservations
      app.kubernetes.io/part-of: dmpf

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment-api.yaml
  - deployment-relay.yaml
  - deployment-consumer.yaml
  - service-api.yaml
  - pdb-api.yaml
  - networkpolicy.yaml
