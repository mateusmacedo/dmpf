apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Postgres de desenvolvimento/homologação: um StatefulSet sem operador nem
# réplica. Em produção o banco é serviço gerenciado e esta base fica de fora.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: dmpf

resources:
  - statefulset.yaml
  - service.yaml

secretGenerator:
  - name: postgres
    literals:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    options:
      disableNameSuffixHash: true
