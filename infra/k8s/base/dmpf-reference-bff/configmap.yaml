# Os contratos viajam na imagem e são servidos pelo BFF. Os alvos gRPC são os
# Services dos `api` no mesmo namespace; o balanceamento por chamada vem do
# resolver dns e do round_robin do cliente.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmpf-reference-bff
data:
  DMPF_SERVICE: dmpf-reference-bff
  DMPF_HTTP_ADDR: ':8080'
  DMPF_ORDERS_GRPC_TARGET: dns:///dmpf-reference-orders-api:9090
  DMPF_RESERVATIONS_GRPC_TARGET: dns:///dmpf-reference-reservations-api:9090
  DMPF_OPENAPI_ORDERS_PATH: /contracts/openapi/orders/v1/openapi.yaml
  DMPF_OPENAPI_RESERVATIONS_PATH: /contracts/openapi/reservations/v1/openapi.yaml
  DMPF_OTLP_ENDPOINT: otel-collector:4317
  DMPF_OTLP_INSECURE: 'false'
