apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# BFF: a única borda REST pública (RST-01), um Deployment sem banco nem Kafka.
# Ele não carrega credencial: o transporte gRPC para os contextos é declarado
# pelo overlay (opt-out de desenvolvimento ou a CA de homologação).

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: dmpf-reference-bff
      app.kubernetes.io/part-of: dmpf

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
