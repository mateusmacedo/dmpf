# A borda não autentica ninguém (a identidade de FND-07 não tem realização no
# kernel), então quem alcança a api é decidido pela rede: só pods rotulados
# como cliente. relay e consumer não servem nada e não recebem tráfego algum.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dmpf-reference-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              dmpf/api-client: 'true'
      ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dmpf-reference-workers
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [relay, consumer]
  policyTypes: [Ingress]
  ingress: []
