# Valores não sensíveis, iguais para os três papéis; cada papel só lê o que
# lhe cabe (config.go valida por papel). Os opt-outs de TLS nascem desligados
# e só o overlay de desenvolvimento os liga.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmpf-reference
data:
  DMPF_SERVICE: dmpf-reference
  DMPF_HTTP_ADDR: ':8080'
  DMPF_OPENAPI_PATH: /contracts/openapi/orders/v1/openapi.yaml
  DMPF_KAFKA_TOPIC: orders.events
  DMPF_KAFKA_DLQ: orders.events.dlq
  DMPF_KAFKA_GROUP: reservations
  DMPF_KAFKA_RESERVATIONS_TOPIC: reservations.events
  DMPF_KAFKA_RESERVATIONS_DLQ: reservations.events.dlq
  DMPF_KAFKA_INSECURE: 'false'
  DMPF_OTLP_ENDPOINT: otel-collector:4317
  DMPF_OTLP_INSECURE: 'false'
  DMPF_ITEM_LIMIT: '10'
