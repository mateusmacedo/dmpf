apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmpf-reference-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: dmpf-reference
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mateusmacedo/dmpf-reference:latest
          args: ['--role', 'api']
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dmpf-reference
            - secretRef:
                name: dmpf-reference
          env:
            - name: DMPF_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # A api não expõe rota de saúde nesta entrega: a sonda é o socket.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 15
