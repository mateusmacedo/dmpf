apiVersion: v1
kind: ConfigMap
metadata:
  name: reservations
data:
  # Kafka gerenciado com TLS (o default da app já é TLS ≥ 1.2; fica explícito) e
  # o gRPC do api com o certificado montado de reservations-grpc-tls.
  DMPF_KAFKA_INSECURE: 'false'
  DMPF_GRPC_TLS_CERT_FILE: /etc/dmpf/grpc/tls.crt
  DMPF_GRPC_TLS_KEY_FILE: /etc/dmpf/grpc/tls.key
  DMPF_SERVICE_VERSION: hmg
