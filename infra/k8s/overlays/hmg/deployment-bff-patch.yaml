apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmpf-reference-bff
spec:
  template:
    spec:
      containers:
        - name: bff
          volumeMounts:
            - name: grpc-ca
              mountPath: /etc/dmpf/grpc
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: grpc-ca
          secret:
            secretName: dmpf-reference-bff-grpc-ca
