apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# hmg: Postgres e Kafka são serviços fora do cluster; só as três apps e a
# plataforma de observabilidade sobem daqui. Os Secrets vêm de fora — DSN e
# brokers de cada contexto, o certificado gRPC de cada api, a CA do BFF e a
# senha do Grafana — por ExternalSecret/SealedSecret com os nomes de
# secrets.example.yaml.tmpl, que mostra a forma e não é aplicado. Sem eles os
# pods ficam em CreateContainerConfigError, que é a falha certa.

namespace: dmpf-hmg

resources:
  - ../../../observability
  - ../../base/dmpf-reference-orders
  - ../../base/dmpf-reference-reservations
  - ../../base/dmpf-reference-bff

images:
  - name: ghcr.io/mateusmacedo/dmpf-reference-bff
    newTag: hmg
  - name: ghcr.io/mateusmacedo/dmpf-reference-orders
    newTag: hmg
  - name: ghcr.io/mateusmacedo/dmpf-reference-reservations
    newTag: hmg

replicas:
  - name: dmpf-reference-bff
    count: 2
  - name: dmpf-reference-orders-api
    count: 2
  - name: dmpf-reference-reservations-api
    count: 2

patches:
  - path: configmap-orders-patch.yaml
  - path: configmap-reservations-patch.yaml
  - path: configmap-bff-patch.yaml
  - path: deployment-orders-api-patch.yaml
  - path: deployment-reservations-api-patch.yaml
  - path: deployment-bff-patch.yaml
