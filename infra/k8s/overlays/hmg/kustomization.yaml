apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# hmg: Postgres e Kafka são serviços fora do cluster; só as quatro apps e a
# plataforma de observabilidade sobem daqui. Os Secrets vêm de fora — DSN e
# brokers de cada contexto, o certificado gRPC de cada api, a CA do BFF, o
# servidor OIDC do BFF, o certificado e a CA do Collector e a senha do Grafana — por ExternalSecret/SealedSecret com os nomes dos
# secrets.example.yaml.tmpl daqui e de cada app, que mostram a forma e não são aplicados. Sem eles os
# pods ficam em CreateContainerConfigError, que é a falha certa.

namespace: dmpf-hmg

resources:
  - ../../../observability
  - apps

configMapGenerator:
  - name: otel-collector
    behavior: merge
    files:
      - tls.yaml=otel-collector-tls.yaml

patches:
  - path: otel-collector-patch.yaml
