# Cria os bancos dos dois contextos no Postgres do overlay. Idempotente: só cria
# o que falta, então reaplicar o overlay não falha; os `api` reiniciam até o
# banco existir e aplicam o schema na partida (DMPF_MIGRATE).
apiVersion: batch/v1
kind: Job
metadata:
  name: dmpf-databases
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-databases
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - >-
              set -e; until pg_isready; do sleep 2; done;
              for db in dmpf_orders dmpf_reservations; do
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1; then
              psql -c "CREATE DATABASE \"$db\""; fi; done
          env:
            - name: PGHOST
              value: postgres-0.postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
