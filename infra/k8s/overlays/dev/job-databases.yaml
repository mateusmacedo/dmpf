# Cria banco e role de cada app no Postgres do overlay, com o banco pertencendo
# ao role. Idempotente: só cria o que falta, então reaplicar o overlay não
# falha; os `api` reiniciam até o banco existir e aplicam o schema na partida
# (DMPF_MIGRATE).
apiVersion: batch/v1
kind: Job
metadata:
  name: dmpf-databases
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-databases
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - >-
              set -e; until pg_isready; do sleep 2; done;
              for pair in orders:$ORDERS_PASSWORD reservations:$RESERVATIONS_PASSWORD
              bookings:$BOOKINGS_PASSWORD; do
              app=${pair%%:*}; pass=${pair#*:};
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$app'" | grep -q 1; then
              psql -c "CREATE ROLE \"$app\" LOGIN PASSWORD '$pass'"; fi;
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$app'" | grep -q 1; then
              psql -c "CREATE DATABASE \"$app\" OWNER \"$app\""; fi; done
          env:
            - name: PGHOST
              value: postgres-0.postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: ORDERS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dmpf-databases
                  key: orders
            - name: RESERVATIONS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dmpf-databases
                  key: reservations
            - name: BOOKINGS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dmpf-databases
                  key: bookings
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
