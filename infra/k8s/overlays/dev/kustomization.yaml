apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: tudo dentro do cluster — Postgres e Redpanda das bases, sem TLS nem no
# Kafka nem no gRPC interno, banco e role de cada app criados pelo Job
# databases, schema aplicado pelo papel api de cada contexto
# (MIGRATE), Grafana anônimo. Credenciais de desenvolvimento geradas aqui;
# nada disto vale para outro ambiente.

namespace: dmpf-dev

resources:
  - ../../base/postgres
  - ../../base/redpanda
  - ../../../observability
  - apps
  - databases

secretGenerator:
  - name: grafana-admin
    literals:
      - password=admin
    options:
      disableNameSuffixHash: true

patches:
  - path: grafana-anonymous-patch.yaml
