apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: tudo dentro do cluster — Postgres e Redpanda das bases, sem TLS nem no
# Kafka nem no gRPC interno, banco e role de cada app criados pelo Job
# dmpf-databases, schema aplicado pelo papel api de cada contexto
# (MIGRATE), Grafana anônimo. Credenciais de desenvolvimento geradas aqui;
# nada disto vale para outro ambiente.

namespace: dmpf-dev

resources:
  - ../../base/postgres
  - ../../base/redpanda
  - ../../../observability
  - ../../../../apps/backend/orders/deploy/k8s/overlays/dev
  - ../../../../apps/backend/reservations/deploy/k8s/overlays/dev
  - ../../../../apps/backend/bookings/deploy/k8s/overlays/dev
  - ../../../../apps/backend/bff/deploy/k8s/overlays/dev
  - job-databases.yaml

secretGenerator:
  - name: dmpf-databases
    literals:
      - orders=orders-dev
      - reservations=reservations-dev
      - bookings=bookings-dev
    options:
      disableNameSuffixHash: true
  - name: grafana-admin
    literals:
      - password=admin
    options:
      disableNameSuffixHash: true

patches:
  - path: grafana-anonymous-patch.yaml
