apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev: tudo dentro do cluster — Postgres e Redpanda das bases, sem TLS,
# schema aplicado pelo papel api (DMPF_MIGRATE), Grafana anônimo. Credenciais
# de desenvolvimento geradas aqui; nada disto vale para outro ambiente.

namespace: dmpf-dev

resources:
  - ../../base/postgres
  - ../../base/redpanda
  - ../../../observability
  - ../../base/dmpf-reference

images:
  - name: ghcr.io/mateusmacedo/dmpf-reference
    newTag: dev

secretGenerator:
  - name: dmpf-reference
    literals:
      - DMPF_PG_DSN=postgres://app:app@postgres-0.postgres:5432/app?sslmode=disable
      - DMPF_KAFKA_BROKERS=redpanda-0.redpanda:9092
    options:
      disableNameSuffixHash: true
  - name: grafana-admin
    literals:
      - password=admin
    options:
      disableNameSuffixHash: true

patches:
  - path: configmap-patch.yaml
  - path: deployment-api-patch.yaml
  - path: grafana-anonymous-patch.yaml
