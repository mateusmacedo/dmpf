# Ambiente de desenvolvimento local.
# Suba serviços por profile, ex: `docker compose --profile postgres up -d`.
# Valores sensíveis vêm de variáveis de ambiente (arquivo .env, ignorado pelo git);
# os defaults abaixo servem apenas para desenvolvimento local.

name: nx-base-template-local

services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres, all]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [redis, all]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
