# floci-ui é o console web do floci: interface e API na mesma porta. Não emula
# nada, cada ação vira chamada SDK contra o floci pelo nome do serviço na rede do
# projeto. FLOCI_CLOUD=aws restringe o console à única nuvem que o floci emula.
# Região e conta ficam no default da imagem (us-east-1, 000000000000), os mesmos
# que as apps usam: o floci isola recursos por conta e o console mostraria vazio
# numa conta diferente. A imagem é alpine, sem curl: o healthcheck usa o wget do
# busybox contra /api/clouds, rota da própria API que não chama o floci. A 0.7.0
# não tem /api/health: rota desconhecida cai no index.html e responde 200.
services:
  floci-ui:
    image: floci/floci-ui:0.7.0@sha256:90dcaa588f9b3cd3cb5ccc98559286574391001e46735b7be4373364d51f7dfe
    profiles: [console, floci, dmpf, all]
    environment:
      FLOCI_CLOUD: aws
      FLOCI_ENDPOINT: http://floci:4566
    ports:
      - '127.0.0.1:${FLOCI_UI_PORT:-4500}:4500'
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4500/api/clouds']
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: '0.10', memory: 256M }
        reservations: { memory: 64M }
