services:
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [load]
    environment:
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s
      K6_PROMETHEUS_RW_STALE_MARKERS: 'true'
      K6_FEATURES: native-histograms
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ../../../apps/backend/load:/load:ro
      - ../../../dist/load:/results
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1024M }
        reservations: { cpus: '0.25', memory: 256M }
