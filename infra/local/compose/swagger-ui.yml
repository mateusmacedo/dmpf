# Swagger UI sobre o contrato que a própria api serve em /openapi.yaml: o
# "Try it out" chama a api de outro origin, por isso o papel api recebe
# DMPF_CORS_ORIGINS com este endereço — só no compose local.
services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.31.0
    profiles: [dmpf]
    environment:
      SWAGGER_JSON_URL: http://localhost:${DMPF_HTTP_PORT:-8080}/openapi.yaml
      TRY_IT_OUT_ENABLED: 'true'
    ports:
      - '${SWAGGER_PORT:-8082}:8080'
    depends_on:
      dmpf-api:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: '0.10', memory: 64M }
        reservations: { cpus: '0.02', memory: 16M }
