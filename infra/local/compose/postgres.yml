# Postgres compartilhado pelas apps: o kernel DMPF cria o schema por
# `dmpfpostgres.Migrate` (DMPF_MIGRATE=true no papel api), não por init script.
services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres, dmpf, all]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 512M }
        reservations: { cpus: '0.10', memory: 128M }

volumes:
  postgres-data:
