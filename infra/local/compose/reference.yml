# Topologia de referência (ADR-044): o BFF é a única borda HTTP publicada no
# host; orders e reservations servem gRPC só na rede do projeto, cada um com o
# próprio banco e role, e cada relay drena apenas a outbox do seu contexto. Os
# bancos nascem no postgres-init; o schema, no papel api (DMPF_MIGRATE=true). Relay e
# consumer reiniciam até as tabelas existirem. Os tópicos vêm do redpanda-init.
x-app: &app
  profiles: [dmpf]
  restart: on-failure

x-orders-image: &orders-image
  build:
    context: ../../..
    dockerfile: apps/backend/orders/Dockerfile
  image: ${DMPF_ORDERS_IMAGE:-orders:local}

x-reservations-image: &reservations-image
  build:
    context: ../../..
    dockerfile: apps/backend/reservations/Dockerfile
  image: ${DMPF_RESERVATIONS_IMAGE:-reservations:local}

x-dmpf-env: &dmpf-env
  DMPF_OTLP_ENDPOINT: otel-collector:4317
  DMPF_OTLP_INSECURE: 'true'
  DMPF_SERVICE_VERSION: ${DMPF_SERVICE_VERSION:-local}

# Sem TLS no broker local (opt-out de desenvolvimento), mas com o cliente
# autenticado por SASL SCRAM no listener interno: cada processo tem o próprio
# principal, criado no redpanda-init (IDN-04).
x-kafka-env: &kafka-env
  DMPF_KAFKA_BROKERS: redpanda:29092
  DMPF_KAFKA_INSECURE: 'true'
  DMPF_KAFKA_GROUP: ${DMPF_KAFKA_GROUP:-reservations}
  DMPF_KAFKA_SASL_MECHANISM: SCRAM-SHA-256

x-kafka-orders: &kafka-orders
  DMPF_KAFKA_SASL_USERNAME: orders
  DMPF_KAFKA_SASL_PASSWORD: ${DMPF_KAFKA_ORDERS_PASSWORD:-orders-local}

x-kafka-reservations: &kafka-reservations
  DMPF_KAFKA_SASL_USERNAME: reservations
  DMPF_KAFKA_SASL_PASSWORD: ${DMPF_KAFKA_RESERVATIONS_PASSWORD:-reservations-local}

x-orders-env: &orders-env
  DMPF_SERVICE: orders
  DMPF_PG_DSN: postgres://orders:${DMPF_ORDERS_PG_PASSWORD:-orders-local}@postgres:5432/orders?sslmode=disable

x-reservations-env: &reservations-env
  DMPF_SERVICE: reservations
  DMPF_PG_DSN: postgres://reservations:${DMPF_RESERVATIONS_PG_PASSWORD:-reservations-local}@postgres:5432/reservations?sslmode=disable

# gRPC interno com mTLS (IDN-03): cada api apresenta o próprio certificado e só
# serve o workload que a CA local assinou e a allowlist nomeia — o BFF. Os
# arquivos vêm do volume do pki-init.
x-grpc-server-env: &grpc-server-env
  DMPF_GRPC_ADDR: ':9090'
  DMPF_GRPC_CLIENT_CA_FILE: /pki/ca.crt
  DMPF_GRPC_TRUSTED_CLIENTS: spiffe://dmpf/bff
  DMPF_MIGRATE: 'true'

x-pki: &pki
  - dmpf-pki:/pki:ro

x-app-limits: &app-limits
  resources:
    limits: { cpus: '0.15', memory: 192M }
    reservations: { cpus: '0.03', memory: 32M }

x-worker-limits: &worker-limits
  resources:
    limits: { cpus: '0.10', memory: 128M }
    reservations: { cpus: '0.02', memory: 32M }

services:
  postgres-init:
    image: postgres:16-alpine
    profiles: [dmpf]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: postgres
    entrypoint: ['/bin/sh', '-c']
    # Idempotente: só cria o role e o banco que ainda não existem, então
    # reexecutar o profile não falha. O banco pertence ao role da app, que
    # assim cria o próprio schema sem privilégio administrativo.
    command:
      - >-
        set -e; for pair in orders:${DMPF_ORDERS_PG_PASSWORD:-orders-local}
        reservations:${DMPF_RESERVATIONS_PG_PASSWORD:-reservations-local}
        bookings:${DMPF_BOOKINGS_PG_PASSWORD:-bookings-local}; do
        app=$${pair%%:*}; pass=$${pair#*:};
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$app'" | grep -q 1; then
        psql -c "CREATE ROLE \"$$app\" LOGIN PASSWORD '$$pass'"; fi;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$app'" | grep -q 1; then
        psql -c "CREATE DATABASE \"$$app\" OWNER \"$$app\""; fi; done
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 32M }
        reservations: { cpus: '0.01', memory: 16M }

  redpanda-init:
    image: redpandadata/redpanda:v26.2.2
    profiles: [dmpf]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    # A ligação entre principal e source que o consumer admite é a ACL (ADR-052):
    # cada processo só escreve no próprio tópico e na DLQ que alimenta, e só o
    # reservations lê orders.events. A autorização liga por último, com as ACLs já
    # gravadas; o superusuário vazio é o principal do listener externo.
    command:
      - |
        set -u
        admin="-X admin.hosts=redpanda:9644"
        su="-X brokers=redpanda:29092 -X user=console -X pass=${DMPF_KAFKA_CONSOLE_PASSWORD:-console-local} -X sasl.mechanism=SCRAM-SHA-256"
        for user in orders:${DMPF_KAFKA_ORDERS_PASSWORD:-orders-local} \
          reservations:${DMPF_KAFKA_RESERVATIONS_PASSWORD:-reservations-local} \
          console:${DMPF_KAFKA_CONSOLE_PASSWORD:-console-local}; do
          rpk security user create "$${user%%:*}" -p "$${user#*:}" --mechanism SCRAM-SHA-256 $$admin || true
        done
        rpk cluster config set superusers '["console",""]' $$admin
        rpk topic create ${DMPF_KAFKA_ORDERS_TOPIC:-orders.events} ${DMPF_KAFKA_ORDERS_DLQ:-orders.events.dlq} \
          ${DMPF_KAFKA_RESERVATIONS_TOPIC:-reservations.events} ${DMPF_KAFKA_RESERVATIONS_DLQ:-reservations.events.dlq} \
          $$su -p 1 -r 1 || true
        rpk security acl create --allow-principal User:orders --operation write,describe \
          --topic ${DMPF_KAFKA_ORDERS_TOPIC:-orders.events} --topic ${DMPF_KAFKA_ORDERS_DLQ:-orders.events.dlq} $$su
        rpk security acl create --allow-principal User:reservations --operation write,describe \
          --topic ${DMPF_KAFKA_RESERVATIONS_TOPIC:-reservations.events} --topic ${DMPF_KAFKA_RESERVATIONS_DLQ:-reservations.events.dlq} \
          --topic ${DMPF_KAFKA_ORDERS_DLQ:-orders.events.dlq} $$su
        rpk security acl create --allow-principal User:reservations --operation read,describe \
          --topic ${DMPF_KAFKA_ORDERS_TOPIC:-orders.events} --group ${DMPF_KAFKA_GROUP:-reservations} $$su
        rpk cluster config set kafka_enable_authorization true $$admin
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 64M }
        reservations: { cpus: '0.01', memory: 16M }

  dmpf-orders-api:
    <<: [*app, *orders-image]
    command: ['--role', 'api']
    environment:
      <<: [*dmpf-env, *orders-env, *grpc-server-env]
      DMPF_INSTANCE_ID: orders-api
      DMPF_ITEM_LIMIT: ${DMPF_ITEM_LIMIT:-10}
      DMPF_GRPC_TLS_CERT_FILE: /pki/dmpf-orders-api.crt
      DMPF_GRPC_TLS_KEY_FILE: /pki/dmpf-orders-api.key
    volumes: *pki
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    deploy: *app-limits

  dmpf-orders-relay:
    <<: [*app, *orders-image]
    command: ['--role', 'relay']
    environment:
      <<: [*dmpf-env, *orders-env, *kafka-env, *kafka-orders]
      DMPF_INSTANCE_ID: orders-relay
      DMPF_KAFKA_ORDERS_TOPIC: ${DMPF_KAFKA_ORDERS_TOPIC:-orders.events}
      DMPF_KAFKA_ORDERS_DLQ: ${DMPF_KAFKA_ORDERS_DLQ:-orders.events.dlq}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      dmpf-orders-api:
        condition: service_started
    deploy: *worker-limits

  dmpf-reservations-api:
    <<: [*app, *reservations-image]
    command: ['--role', 'api']
    environment:
      <<: [*dmpf-env, *reservations-env, *grpc-server-env]
      DMPF_INSTANCE_ID: reservations-api
      DMPF_GRPC_TLS_CERT_FILE: /pki/dmpf-reservations-api.crt
      DMPF_GRPC_TLS_KEY_FILE: /pki/dmpf-reservations-api.key
    volumes: *pki
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    deploy: *app-limits

  dmpf-reservations-relay:
    <<: [*app, *reservations-image]
    command: ['--role', 'relay']
    environment:
      <<: [*dmpf-env, *reservations-env, *kafka-env, *kafka-reservations]
      DMPF_INSTANCE_ID: reservations-relay
      DMPF_KAFKA_RESERVATIONS_TOPIC: ${DMPF_KAFKA_RESERVATIONS_TOPIC:-reservations.events}
      DMPF_KAFKA_RESERVATIONS_DLQ: ${DMPF_KAFKA_RESERVATIONS_DLQ:-reservations.events.dlq}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      dmpf-reservations-api:
        condition: service_started
    deploy: *worker-limits

  dmpf-reservations-consumer:
    <<: [*app, *reservations-image]
    command: ['--role', 'consumer']
    environment:
      <<: [*dmpf-env, *reservations-env, *kafka-env, *kafka-reservations]
      DMPF_INSTANCE_ID: reservations-consumer
      DMPF_KAFKA_ORDERS_TOPIC: ${DMPF_KAFKA_ORDERS_TOPIC:-orders.events}
      DMPF_KAFKA_ORDERS_DLQ: ${DMPF_KAFKA_ORDERS_DLQ:-orders.events.dlq}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      dmpf-reservations-api:
        condition: service_started
    deploy: *worker-limits

  dmpf-bff:
    <<: *app
    build:
      context: ../../..
      dockerfile: apps/backend/bff/Dockerfile
    image: ${DMPF_BFF_IMAGE:-bff:local}
    environment:
      <<: *dmpf-env
      DMPF_SERVICE: bff
      DMPF_INSTANCE_ID: bff
      DMPF_HTTP_ADDR: ':8080'
      DMPF_ORDERS_GRPC_TARGET: dns:///dmpf-orders-api:9090
      DMPF_RESERVATIONS_GRPC_TARGET: dns:///dmpf-reservations-api:9090
      # Autenticador de desenvolvimento (IDN-01): lê a identidade declarada no
      # próprio Bearer; fora do compose a partida exige DMPF_OIDC_ISSUER.
      DMPF_AUTH_DEV_MOCK: 'true'
      # Sem DMPF_GRPC_SERVER_NAME: cada alvo é verificado pelo próprio host.
      DMPF_GRPC_CA_FILE: /pki/ca.crt
      DMPF_GRPC_CLIENT_CERT_FILE: /pki/bff-client.crt
      DMPF_GRPC_CLIENT_KEY_FILE: /pki/bff-client.key
      DMPF_OPENAPI_ORDERS_PATH: /contracts/openapi/orders/v1/openapi.yaml
      DMPF_OPENAPI_RESERVATIONS_PATH: /contracts/openapi/reservations/v1/openapi.yaml
      # Só o Swagger UI local chama o BFF de outro origin; fora do
      # desenvolvimento a variável fica vazia e a borda é same-origin.
      DMPF_CORS_ORIGINS: http://localhost:${SWAGGER_PORT:-8082},http://127.0.0.1:${SWAGGER_PORT:-8082}
    ports:
      - '${DMPF_HTTP_PORT:-8080}:8080'
    volumes: *pki
    depends_on:
      pki-init:
        condition: service_completed_successfully
      dmpf-orders-api:
        condition: service_started
      dmpf-reservations-api:
        condition: service_started
      otel-collector:
        condition: service_started
    deploy: *app-limits
