# Infra dos testes de integração, separada da infra local de runtime
# (infra/local): outro projeto Compose, outras portas no host e nenhum volume.
# Todo dado vive em tmpfs, então nada que um teste cria sobrevive a um
# test-infra-down. O Postgres sobe com cluster_name=test, que o tb/pg exige
# antes de criar ou apagar um banco: a suíte recusa o servidor de runtime.
name: testinfra

services:
  postgres:
    image: postgres:16-alpine
    command: ['postgres', '-c', 'cluster_name=test', '-c', 'fsync=off', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '15432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:19092
    ports:
      - '19092:9092'
      - '19644:9644'
    volumes:
      - { type: tmpfs, target: /var/lib/redpanda/data, tmpfs: { mode: 01777 } }
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 30

  # Segundo broker, que exige SASL SCRAM (IDN-04), para o teste de
  # autenticação de cliente; o usuário nasce no redpanda-sasl-init.
  redpanda-sasl:
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --advertise-kafka-addr=sasl://localhost:19093
      - --set
      - 'redpanda.kafka_api=[{"name":"sasl","address":"0.0.0.0","port":9092,"authentication_method":"sasl"}]'
      - --set
      - 'redpanda.superusers=["it"]'
      - --set
      - redpanda.kafka_enable_authorization=true
    ports:
      - '19093:9092'
    volumes:
      - { type: tmpfs, target: /var/lib/redpanda/data, tmpfs: { mode: 01777 } }
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health -X admin.hosts=localhost:9644 | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda-sasl-init:
    image: redpandadata/redpanda:v26.2.2
    profiles: [init]
    entrypoint:
      - sh
      - -c
      - >-
        rpk security user list -X admin.hosts=redpanda-sasl:9644 | grep -qw it ||
        rpk security user create it -p it-secret --mechanism SCRAM-SHA-256 -X admin.hosts=redpanda-sasl:9644

  floci:
    image: floci/floci:2.0.1
    ports:
      - '14566:4566'
    tmpfs:
      - /app/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', '-o', '/dev/null', 'http://localhost:4566/_floci/health']
      interval: 2s
      timeout: 3s
      retries: 30
