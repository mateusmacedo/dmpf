# O relay drena por claim com lease (OBX-09) só a outbox do banco
# reservations, onde o consumer enfileira ReservationConfirmed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservations-relay
  labels:
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/component: relay
    spec:
      serviceAccountName: reservations
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/mateusmacedo/reservations:latest
          args: ['--role', 'relay']
          envFrom:
            - configMapRef:
                name: reservations
            - secretRef:
                name: reservations
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: $(OTEL_RESOURCE_ATTRIBUTES),service.instance.id=$(K8S_POD_NAME),dmpf.process.role=relay
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      # ShutdownGrace do relay é 10 s; o pod espera mais que isso.
      terminationGracePeriodSeconds: 30
