apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservations-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Em dev o api aplica o schema e os grants na partida, ambos
            # idempotentes; relay e consumer esperam os grants da role de runtime.
            - name: MIGRATE
              value: 'true'
