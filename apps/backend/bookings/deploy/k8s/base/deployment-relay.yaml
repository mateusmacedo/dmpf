# O relay drena por claim com lease (OBX-09) só a outbox do banco bookings:
# mais de uma réplica é seguro, mas uma basta para o volume de referência.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings-relay
  labels:
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/component: relay
    spec:
      serviceAccountName: bookings
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/mateusmacedo/bookings:latest
          args: ['--role', 'relay']
          envFrom:
            - configMapRef:
                name: bookings
            - secretRef:
                name: bookings
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      # ShutdownGrace do relay é 10 s; o pod espera mais que isso.
      terminationGracePeriodSeconds: 20
