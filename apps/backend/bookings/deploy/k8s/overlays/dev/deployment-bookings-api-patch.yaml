apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookings-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Em dev o api aplica o schema na partida (postgres.Migrate é
            # idempotente); o relay reinicia até as tabelas existirem.
            - name: MIGRATE
              value: 'true'
