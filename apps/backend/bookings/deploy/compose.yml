# Processos do bookings na topologia local (ADR-044): api gRPC, que aplica o
# schema (MIGRATE=true), e relay da própria outbox.
x-image: &image
  build:
    context: ../../../..
    dockerfile: apps/backend/bookings/Dockerfile
  image: ${BOOKINGS_IMAGE:-bookings:local}

x-env: &env
  OTEL_SERVICE_NAME: bookings
  PG_DSN: postgres://bookings:${BOOKINGS_PG_PASSWORD:-bookings-local}@postgres:5432/bookings?sslmode=disable

services:
  dmpf-bookings-api:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-grpc-api
    stop_grace_period: 30s
    environment:
      <<: *env
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=bookings-api,dmpf.process.role=api
      GRPC_TLS_CERT_FILE: /pki/dmpf-bookings-api.crt
      GRPC_TLS_KEY_FILE: /pki/dmpf-bookings-api.key
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  dmpf-bookings-relay:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-kafka-worker
    stop_grace_period: 30s
    command: ['--role', 'relay']
    environment:
      <<: *env
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=bookings-relay,dmpf.process.role=relay
      KAFKA_SASL_USERNAME: bookings
      KAFKA_SASL_PASSWORD: ${KAFKA_BOOKINGS_PASSWORD:-bookings-local}
      KAFKA_GROUP: bookings
      KAFKA_BOOKINGS_TOPIC: ${KAFKA_BOOKINGS_TOPIC:-bookings.events}
      KAFKA_BOOKINGS_DLQ: ${KAFKA_BOOKINGS_DLQ:-bookings.events.dlq}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      dmpf-bookings-api:
        condition: service_started
