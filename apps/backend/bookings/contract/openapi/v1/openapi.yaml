openapi: 3.1.0
info:
  title: Bookings — resource-scheduling bounded context
  version: 1.0.0
  description: >-
    Public REST edge of the bookings context, served by apps/backend/bff,
    which calls the bookings context over gRPC (ADR-024).
    Every route of the service references one operation of this document
    (RST-04). Writes are idempotent by Idempotency-Key (RST-02); reads run
    outside any transaction (UOW-11). The contract is registered under
    contracts/openapi/ (REP-06) and is not covered by the Buf gates.
servers:
  - url: http://localhost:8080
    description: local bff
security:
  - bearerAuth: []
paths:
  /bookings/booking:
    post:
      operationId: reserveBooking
      summary: Reserve a booking for a resource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '201':
          description: Booking reserved
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReserveConflict'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/AdmissionRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/Failure'
    get:
      operationId: findBookingByResource
      summary: List bookings for a resource
      parameters:
        - $ref: '#/components/parameters/ResourceIDQuery'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Bookings for the resource
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/AdmissionRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/Failure'
  /bookings/booking/{id}:
    get:
      operationId: findBooking
      summary: Read the observable state of a booking
      parameters:
        - $ref: '#/components/parameters/BookingID'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Current snapshot of the booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/AdmissionRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/Failure'
  /bookings/booking/{id}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel an existing reserved booking
      parameters:
        - $ref: '#/components/parameters/BookingID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Booking cancelled
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/AdmissionRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/Failure'
  /bookings/resource:
    post:
      operationId: registerResource
      summary: Register a resource (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Resource registered
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/AdmissionRefused'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
        default:
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Access token do servidor de autorização que o BFF verifica (OIDC). No
        compose local o BFF roda com AUTH_DEV_MOCK=true e lê a identidade do
        próprio token, sem verificação — informe um JSON como
        {"sub":"dev","tenant":"acme","permissions":["bookings:write","bookings:read"]}.
  parameters:
    BookingID:
      name: id
      in: path
      required: true
      description: Identifier of the booking aggregate; the client mints it (RFC §9.3)
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    ResourceIDQuery:
      name: resourceId
      in: query
      required: true
      description: Filter bookings by resource identifier
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-chosen key that makes the POST idempotent (RST-02, FND-04 §7.6).
        A POST without it, or with a key outside this format, is refused with
        400 before any call to the context. The edge scopes the key to the
        authenticated subject. Within 24h, the same key with the same request
        answers the stored response, marked by the Idempotent-Replayed header;
        with another request it is refused with 422 reused-idempotency-key, and
        while the first request is still in progress with 409
        in-flight-idempotency-key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Correlation of the whole chain the request starts (ENV-08). When
        absent or outside this shape the edge mints one.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
  schemas:
    ReserveRequest:
      type: object
      required: [bookingId, resourceId, quantity]
      additionalProperties: false
      properties:
        bookingId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        resourceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    ReservedResponse:
      type: object
      required: [bookingId]
      properties:
        bookingId:
          type: string
    CancelledResponse:
      type: object
      required: [bookingId]
      properties:
        bookingId:
          type: string
    RegisterRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
    RegisteredResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
    BookingView:
      type: object
      required: [id, resourceId, quantity, status, reservedAt]
      properties:
        id:
          type: string
        resourceId:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [new, reserved, cancelled]
        reservedAt:
          type: integer
          format: int64
    Rejection:
      type: object
      required: [code, message]
      description: >-
        A refusal the domain or the edge declared. Domain codes take the
        "context/aggregate/reason" form (FND-03 §5.3; ADR-053).
      properties:
        code:
          type: string
          examples:
            - resource-scheduling/booking/not-reserved
            - missing-idempotency-key
            - invalid-idempotency-key
            - reused-idempotency-key
            - in-flight-idempotency-key
            - already-exists
        message:
          type: string
  headers:
    IdempotentReplayed:
      description: >-
        Present with the value true when the answer is the stored response of
        an earlier request with the same Idempotency-Key (IDM-08); absent on the
        first answer.
      schema:
        type: string
        enum: ['true']
  responses:
    BadRequest:
      description: The request is malformed or misses Idempotency-Key, or carries it outside its format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    NotFound:
      description: No booking with this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    VersionConflict:
      description: >-
        A concurrent write advanced the aggregate (replay the request), or a request with the same
        Idempotency-Key is still in progress (in-flight-idempotency-key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    ReserveConflict:
      description: >-
        The booking already exists (already-exists), a request with the same
        Idempotency-Key is still in progress (in-flight-idempotency-key), or a
        concurrent reservation of the same booking won; replay the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    Rejected:
      description: >-
        The domain refused the command (a business rejection, not a failure), or
        the Idempotency-Key was already used with another request
        (reused-idempotency-key)
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    AdmissionRefused:
      description: Admission control refused the request before reading the body (RES-17)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    Unavailable:
      description: The bookings context is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    Timeout:
      description: The deadline of the request expired before the context answered (GRP-04)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
    Failure:
      description: Technical failure; the body carries no internal detail (ERR-20)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Rejection'
