# Processos do orders na topologia local (ADR-044): api gRPC, que aplica o schema
# (MIGRATE=true), e relay, que drena a outbox. Banco e role nascem no
# postgres-init; o tópico, no redpanda-init.
x-image: &image
  build:
    context: ../../../..
    dockerfile: apps/backend/orders/Dockerfile
  image: ${ORDERS_IMAGE:-orders:local}

x-env: &env
  OTEL_SERVICE_NAME: orders
  PG_DSN: postgres://orders:${ORDERS_PG_PASSWORD:-orders-local}@postgres:5432/orders?sslmode=disable

services:
  dmpf-orders-api:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-grpc-api
    stop_grace_period: 30s
    environment:
      <<: *env
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=orders-api,dmpf.process.role=api
      ITEM_LIMIT: ${ITEM_LIMIT:-10}
      GRPC_TLS_CERT_FILE: /pki/dmpf-orders-api.crt
      GRPC_TLS_KEY_FILE: /pki/dmpf-orders-api.key
    deploy:
      resources:
        limits: { cpus: '0.2808', memory: 211M }
    depends_on:
      pki-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  dmpf-orders-relay:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-kafka-worker
    stop_grace_period: 30s
    command: ['--role', 'relay']
    environment:
      <<: *env
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=orders-relay,dmpf.process.role=relay
      KAFKA_SASL_USERNAME: orders
      KAFKA_SASL_PASSWORD: ${KAFKA_ORDERS_PASSWORD:-orders-local}
      KAFKA_GROUP: orders
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-orders.events}
      KAFKA_ORDERS_DLQ: ${KAFKA_ORDERS_DLQ:-orders.events.dlq}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      dmpf-orders-api:
        condition: service_started
