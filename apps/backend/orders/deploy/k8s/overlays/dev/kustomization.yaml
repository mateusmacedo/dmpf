apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/mateusmacedo/orders
    newTag: dev

secretGenerator:
  - name: orders
    literals:
      - PG_DSN=postgres://orders:orders-dev@postgres-0.postgres:5432/orders?sslmode=disable
      - KAFKA_BROKERS=redpanda-0.redpanda:9092
    options:
      disableNameSuffixHash: true

patches:
  - path: configmap-orders-patch.yaml
  - path: deployment-orders-api-patch.yaml
