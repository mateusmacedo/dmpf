syntax = "proto3";

package company.orders.service.v1;

// Internal synchronous surface of the orders bounded context (GRP-01). A domain
// refusal travels as `rejection` in the response; a technical failure is a gRPC
// status.
service OrdersService {
  rpc AddItem(AddItemRequest) returns (AddItemResponse);
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc FindOrder(FindOrderRequest) returns (FindOrderResponse);
}

message AddItemRequest {
  string order_id = 1;
  string sku = 2;
  int32 quantity = 3;
}

message AddItemResponse {
  oneof result {
    ItemAccepted accepted = 1;
    Rejection rejection = 2;
  }
}

message ItemAccepted {
  string order_id = 1;
  int32 item_count = 2;
}

message PlaceOrderRequest {
  string order_id = 1;
}

message PlaceOrderResponse {
  oneof result {
    Placed placed = 1;
    Rejection rejection = 2;
  }
}

message Placed {
  string order_id = 1;
}

message FindOrderRequest {
  string order_id = 1;
}

message FindOrderResponse {
  Order order = 1;
}

message Order {
  string order_id = 1;
  OrderStatus status = 2;
  int32 item_limit = 3;
  repeated Item items = 4;
}

message Item {
  string sku = 1;
  int32 quantity = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_PLACED = 2;
}

message Rejection {
  string code = 1;
  string message = 2;
}
