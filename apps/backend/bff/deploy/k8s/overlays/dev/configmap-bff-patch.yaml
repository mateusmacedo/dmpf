apiVersion: v1
kind: ConfigMap
metadata:
  name: bff
data:
  # O Collector da base e os `api` dos contextos rodam sem TLS em dev.
  OTLP_INSECURE: 'true'
  GRPC_INSECURE: 'true'
  # Sem servidor de autorização em dev: a identidade vem do próprio Bearer, sem
  # verificação. Em hmg o BFF verifica por OIDC (Secret bff-oidc).
  AUTH_DEV_MOCK: 'true'
  SERVICE_VERSION: dev
