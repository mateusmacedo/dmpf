# O BFF é a única borda HTTP publicada no host (ADR-044); fala gRPC com mTLS com
# cada contexto e serve os OpenAPI embutidos na imagem.
services:
  dmpf-bff:
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-http-edge
    build:
      context: ../../../..
      dockerfile: apps/backend/bff/Dockerfile
    image: ${BFF_IMAGE:-bff:local}
    environment:
      SERVICE: bff
      INSTANCE_ID: bff
      HTTP_ADDR: ':8080'
      ORDERS_GRPC_TARGET: dns:///dmpf-orders-api:9090
      RESERVATIONS_GRPC_TARGET: dns:///dmpf-reservations-api:9090
      BOOKINGS_GRPC_TARGET: dns:///dmpf-bookings-api:9090
      # Autenticador de desenvolvimento (IDN-01): lê a identidade declarada no
      # próprio Bearer; fora do compose a partida exige OIDC_ISSUER.
      AUTH_DEV_MOCK: 'true'
      # Sem GRPC_SERVER_NAME: cada alvo é verificado pelo próprio host.
      GRPC_CA_FILE: /pki/ca.crt
      GRPC_CLIENT_CERT_FILE: /pki/bff-client.crt
      GRPC_CLIENT_KEY_FILE: /pki/bff-client.key
      OPENAPI_ORDERS_PATH: /contracts/openapi/orders/v1/openapi.yaml
      OPENAPI_RESERVATIONS_PATH: /contracts/openapi/reservations/v1/openapi.yaml
      OPENAPI_BOOKINGS_PATH: /contracts/openapi/bookings/v1/openapi.yaml
      # Só o Swagger UI local chama o BFF de outro origin; fora do
      # desenvolvimento a variável fica vazia e a borda é same-origin.
      CORS_ORIGINS: http://localhost:${SWAGGER_PORT:-8082},http://127.0.0.1:${SWAGGER_PORT:-8082}
    ports:
      - '${HTTP_PORT:-8080}:8080'
    depends_on:
      pki-init:
        condition: service_completed_successfully
      dmpf-orders-api:
        condition: service_started
      dmpf-reservations-api:
        condition: service_started
      dmpf-bookings-api:
        condition: service_started
      otel-collector:
        condition: service_started
